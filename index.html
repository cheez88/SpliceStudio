<title>Splice Studio</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Splice">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Caveat:wght@700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: editor shell — media bin | preview | inspector over a full-width multi-track timeline; phones collapse the side panels into bottom sheets. Single dark look by choice (editing suites stay dark so footage reads true). */
:root{
  color-scheme: dark;
  --bg:#0e1014; --panel:#15181e; --raise:#1d2129; --raise2:#252a34; --line:#2a303b;
  --fg:#e8eaef; --muted:#8b92a1; --dim:#5b6270;
  --cue:#f2c14e; --cue-ink:#1b1504;
  --trk-video:#35679c; --trk-text:#9656b8; --trk-audio:#2b8f70; --danger:#e5484d;
  --f-ui:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-brand:"Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --headw:84px; --r:6px;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:500 13px/1.4 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cue);outline-offset:2px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;height:100dvh;padding-top:env(safe-area-inset-top,0px);display:grid;grid-template-columns:272px minmax(0,1fr) 304px;grid-template-rows:50px minmax(0,1fr) 260px;
  grid-template-areas:"top top top" "left stage right" "tl tl tl"}

/* top bar */
.topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding-inline:14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:800 17px/1 var(--f-brand);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:18px;height:18px;border-radius:4px;background:
  linear-gradient(90deg,var(--trk-video) 0 45%,transparent 45% 55%,var(--trk-video) 55%);position:relative}
.brand i::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--cue)}
#projName{background:transparent;border:1px solid transparent;border-radius:var(--r);padding:5px 8px;min-width:0;width:220px;color:var(--muted)}
#projName:hover,#projName:focus{border-color:var(--line);color:var(--fg);outline:none}
.sp{flex:1}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding-inline:8px;border-radius:var(--r);color:var(--fg)}
.ibtn:hover{background:var(--raise)}
.ibtn:disabled{opacity:.35;cursor:default;background:none}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding-inline:12px;border-radius:var(--r);background:var(--raise2);font-weight:700}
.btn:hover{background:#2e3440}
.btn.primary{background:var(--cue);color:var(--cue-ink)}
.btn.primary:hover{background:#ffd062}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:#ff8a8d}

/* panels */
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{grid-area:left;border-right:1px solid var(--line)}
#right{grid-area:right;border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1 1 0;min-width:0;padding:7px 4px 8px;border-radius:var(--r) var(--r) 0 0;color:var(--muted);font-weight:700;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;white-space:nowrap}
.tabs .sheet-close{flex:none;align-self:center}
#right .tab{flex:0 0 auto;flex-direction:row;padding-inline:10px}
.tab.on{color:var(--fg);box-shadow:inset 0 -2px var(--cue)}
.sheet-close{display:none;margin-left:auto}
.pbody{overflow:auto;padding:14px;flex:1;min-height:0}
.h6{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}

/* media bin */
.drop{border:1px dashed #3a4150;border-radius:8px;padding:14px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center;margin-bottom:14px}
.drop b{color:var(--fg)}
.bin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{position:relative;border-radius:6px;overflow:hidden;background:var(--raise);cursor:pointer;display:flex;flex-direction:column}
.item .th{aspect-ratio:16/10;background:#0a0c10 center/cover no-repeat;position:relative;display:grid;place-items:center;color:var(--muted)}
.item .th .wave{position:absolute;inset:18% 6%;background:center/100% 100% no-repeat}
.item .meta{padding:6px 7px 7px;display:grid;gap:2px;min-width:0}
.item .nmrow{display:flex;align-items:center;gap:4px;min-width:0;height:22px}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:700;flex:1;min-width:0}
.item .ren{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--muted);flex:none}
.item .ren svg{width:13px;height:13px}
.item .ren:hover{background:var(--raise2);color:var(--fg)}
.item .sub{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--muted);min-width:0}
.item .sub span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.reninput{width:100%;min-width:0;height:22px;background:var(--bg);border:1px solid var(--cue);border-radius:4px;padding:0 6px;font-size:12px;font-weight:700;outline:none}
.binhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px;margin-bottom:8px}
.binhead .h6{margin:0;white-space:nowrap}
.sortsel{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600}
.sortsel{min-width:0}
.sortsel select{max-width:100%;background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-size:12px;font-weight:600}
.wide-btn{width:100%;justify-content:center;margin-bottom:12px;height:30px;font-size:12px}
.lblin{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;font-weight:700}
.lblin:focus{border-color:var(--cue);outline:none}
.item .du{font:500 10px var(--f-mono);color:var(--muted)}
.item .kind{position:absolute;left:5px;top:5px;font:700 9px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:3px;background:rgba(10,12,16,.75)}
.item .add{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:var(--cue);color:var(--cue-ink);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.item:hover .add,.item:focus-within .add{opacity:1}
@media (hover:none){.item .add{opacity:1}}
.chip-s{position:absolute;left:5px;bottom:5px;font:700 9px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--cue-ink);background:var(--cue);padding:3px 5px;border-radius:3px}

/* text presets */
.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preset{height:78px;border-radius:6px;background:linear-gradient(160deg,#28303d,#161a21);display:grid;place-items:center;padding:6px;text-align:center;line-height:1.05;overflow:hidden}
.preset:hover{outline:1px solid var(--cue)}

/* stage */
#stage{grid-area:stage;display:flex;flex-direction:column;min-height:0;min-width:0;background:
  radial-gradient(ellipse at 50% 40%,#161a22,var(--bg) 70%)}
.viewer{flex:1;min-height:0;display:grid;place-items:center;padding:16px;position:relative}
#cv{background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:3px;touch-action:none;display:block}
.transport{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line)}
.tc b{font-weight:inherit}
.tc{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.tc span{color:var(--dim)}
.play{width:40px;height:40px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.play svg{width:18px;height:18px;fill:currentColor;stroke:none}
.play:hover{background:#fff}
.tgroup{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.tside{flex:1;display:flex;align-items:center;gap:6px}
.tside.r{justify-content:flex-end}
.pill{font:700 11px var(--f-ui);padding:4px 8px;border-radius:99px;background:var(--raise);color:var(--muted);white-space:nowrap}

/* inspector */
.ihead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ihead .sw{width:10px;height:28px;border-radius:3px;flex:none}
.ihead .t{font:800 15px/1.2 var(--f-brand);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ihead .s{font:500 11px var(--f-mono);color:var(--muted)}
.acts{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.acts .btn{height:30px;padding-inline:10px;font-size:12px}
.sec{border-top:1px solid var(--line);padding-block:14px}
.sec:first-of-type{border-top:0;padding-top:0}
.field{display:grid;gap:6px;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field>label{font-size:12px;color:var(--muted);font-weight:600}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;min-width:0;accent-color:var(--cue)}
.slider output{font:500 11px var(--f-mono);min-width:48px;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:5px 9px;border-radius:5px;background:var(--raise);font-size:12px;font-weight:600;color:var(--muted);border:1px solid transparent}
.chip:hover{color:var(--fg)}
.chip.on{background:rgba(242,193,78,.12);color:var(--cue);border-color:rgba(242,193,78,.45)}
.fxgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.fx{display:grid;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center}
.fx span{aspect-ratio:1;border-radius:5px;background:#333 center/cover;border:2px solid transparent}
.fx.on{color:var(--cue)} .fx.on span{border-color:var(--cue)}
.trgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.trgrid .chip{padding:10px;text-align:left}
textarea{width:100%;min-height:70px;resize:vertical;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-weight:600}
.colors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.col{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.col.on{border-color:var(--cue);box-shadow:0 0 0 2px var(--panel) inset}
input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;border-radius:50%}
.note{color:var(--muted);font-size:12px;line-height:1.5}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;color:var(--muted)}
kbd{font:500 11px var(--f-mono);background:var(--raise);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--fg);justify-self:start;white-space:nowrap}
.stat{display:flex;justify-content:space-between;font-size:12px;padding-block:3px;color:var(--muted)}
.stat b{color:var(--fg);font:500 12px var(--f-mono)}

/* timeline */
#timeline{grid-area:tl;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel);min-height:0;min-width:0}
.tlbar{display:flex;align-items:center;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line);flex:none}
.tlbar .div{width:1px;height:20px;background:var(--line);margin-inline:6px}
.tlbar .ibtn.on{color:var(--cue);background:rgba(242,193,78,.1)}
#zoom{width:120px;accent-color:var(--cue)}
#tls{flex:1;overflow:auto;position:relative;min-height:0;overscroll-behavior:contain}
#tli{position:relative;min-height:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.clip .h{touch-action:none}
.ruler{touch-action:none}
.row{display:flex;position:relative}
.head{flex:0 0 var(--headw);position:sticky;left:0;z-index:6;background:var(--panel);border-right:1px solid var(--line);
  display:flex;align-items:center;gap:7px;padding-inline:10px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.head svg{width:14px;height:14px}
.track{flex:1;position:relative}
.ruler{position:sticky;top:0;z-index:7;height:26px;background:var(--panel);border-bottom:1px solid var(--line)}
.ruler .head{z-index:8}
.tick{position:absolute;bottom:0;width:1px;background:#3a414d;height:5px}
.tick.maj{height:10px;background:#566070}
.tick b{position:absolute;left:4px;bottom:9px;font:500 10px var(--f-mono);color:var(--muted);white-space:nowrap}
.lane{border-bottom:1px solid #20242c}
.lane .track{background:repeating-linear-gradient(90deg,transparent 0 calc(var(--pps) - 1px),rgba(255,255,255,.025) calc(var(--pps) - 1px) var(--pps))}
.clip{position:absolute;border-radius:5px;overflow:hidden;cursor:grab;display:flex;align-items:flex-end;touch-action:pan-x pan-y;-webkit-user-drag:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.clip:active{cursor:grabbing}
.clip.v{background-color:var(--trk-video);background-repeat:no-repeat}
.clip.v.img{background-repeat:repeat-x;background-size:auto 100%}
.clip.t{background:var(--trk-text);align-items:center}
.clip.a{background-color:var(--trk-audio);background-repeat:no-repeat}
.clip .lbl{position:relative;z-index:1;margin:0 10px 4px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,0,0,.7);min-width:0;max-width:calc(100% - 20px);pointer-events:none}
.clip.t .lbl{margin-bottom:0}
.clip .bdg{position:absolute;top:4px;left:10px;display:flex;gap:4px;pointer-events:none;z-index:1}
.clip .bdg i{white-space:nowrap;font:700 9px/1 var(--f-ui);font-style:normal;background:rgba(0,0,0,.6);padding:3px 4px;border-radius:3px;letter-spacing:.03em}
.clip.v::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.55));pointer-events:none}
.clip.sel{box-shadow:inset 0 0 0 2px var(--cue);z-index:3}
.clip .h{position:absolute;top:0;bottom:0;width:10px;z-index:2;cursor:ew-resize;display:grid;place-items:center}
.clip .h::before{content:"";width:3px;height:40%;border-radius:2px;background:rgba(255,255,255,.7)}
.clip .h.l{left:0} .clip .h.r{right:0}
.clip.sel .h{background:var(--cue)} .clip.sel .h::before{background:var(--cue-ink)}
.clip.dragging{opacity:.85;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 0 0 2px var(--cue)}
.trans{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:5px;transform:rotate(45deg);z-index:4;
  background:var(--raise2);border:1px solid #4a5263;display:grid;place-items:center}
.trans svg{transform:rotate(-45deg);width:12px;height:12px}
.trans.has{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.trans.sel{background:var(--cue);color:var(--cue-ink);border-color:var(--cue)}
.trans:hover{border-color:var(--cue)}
.insmark{position:absolute;top:4px;bottom:4px;width:3px;margin-left:-1px;background:var(--cue);border-radius:2px;z-index:8;pointer-events:none}
.empty{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12px;white-space:nowrap;pointer-events:none}
#ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--cue);z-index:5;pointer-events:none}
#ph::before{content:"";position:absolute;top:0;left:-6px;width:14px;height:14px;background:var(--cue);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,6,9,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:16px}
.modal h2{margin:0;font:800 20px/1.2 var(--f-brand);letter-spacing:-.01em}
.bar{height:8px;border-radius:99px;background:var(--raise2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cue);transition:width .2s linear}
.convbox{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:59;width:min(420px,calc(100% - 32px));
  background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.convbox .stat span{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin-right:10px}
.convbox .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.convbox small{color:var(--muted);font-size:11.5px;line-height:1.35}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#outVid{width:100%;max-height:44vh;background:#000;border-radius:6px}

.savest{font-size:11px;font-weight:700;color:var(--dim);white-space:nowrap}
.savest[data-s="Saving…"]{color:var(--muted)}
.savest[data-s="Not saved"],.savest[data-s="Not saving"]{color:#ff8a8d}
.modal.wide{width:min(760px,100%)}
.mhead{display:flex;align-items:center;gap:8px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pcard{background:var(--raise);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid transparent;min-width:0}
.pcard.cur{border-color:rgba(242,193,78,.5)}
.pthumb{height:130px;background:#07080b;display:grid;place-items:center;position:relative;width:100%}
.pthumb span{height:100%;max-width:100%;background:#1d2129 center/cover no-repeat}
.pthumb em{position:absolute;left:8px;top:8px;font:700 9px/1 var(--f-ui);font-style:normal;letter-spacing:.06em;text-transform:uppercase;background:var(--cue);color:var(--cue-ink);padding:3px 5px;border-radius:3px}
.pmeta{padding:10px 10px 4px;display:grid;gap:2px;min-width:0}
.pmeta b{font:800 14px/1.25 var(--f-brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta span{font-size:11px;color:var(--muted)}
.pacts{display:flex;gap:4px;padding:6px 10px 10px;align-items:center}
.pacts .btn{height:30px;font-size:12px;flex:1;justify-content:center}
.pacts .ibtn.armed{color:#ff8a8d;background:rgba(229,72,77,.12);font-size:11px;font-weight:700}
.orient{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.orient .btn{height:auto;padding:8px 4px;flex-direction:column;gap:4px;font-size:11px;justify-content:center}
.orient .btn svg{width:18px;height:18px}
.orient .btn.on{background:rgba(242,193,78,.14);color:var(--cue)}
.adjhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.adjhead .h6{margin:0}
.adjhead .btn{height:30px;font-size:12px}
.h6.subh{margin:12px 0 8px;color:var(--dim);font-size:10px}
.field>label .scale{float:right;display:inline-flex;gap:10px;color:var(--dim);font-size:10px;font-weight:600}
.slider.grad input{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;cursor:pointer}
.slider.grad input::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--fg);border:2px solid var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.slider.grad input::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--fg);border:2px solid var(--bg)}
.slider.temp input{background:linear-gradient(90deg,#4f8fff,#c9ccd3,#ffb14a)}
.slider.tint input{background:linear-gradient(90deg,#4cc36a,#c9ccd3,#e05ad0)}

.mk{position:absolute;top:2px;bottom:2px;border-radius:4px;background:color-mix(in srgb,var(--hc) 30%,transparent);border-left:3px solid var(--hc);z-index:3;cursor:grab;
  display:flex;align-items:center;overflow:hidden;touch-action:none}

.mk.done{opacity:.45} .mk.done span{text-decoration:line-through}
.mk .mh{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}
.mk .mh.l{left:-3px} .mk .mh.r{right:0}

.mkband.sel{background:color-mix(in srgb,var(--hc) 26%,transparent);border-inline-style:solid}
.mkband.done{opacity:.35}
.hllist{display:grid;gap:6px}

.hlrow:hover{background:var(--raise2)}

.hlchk{width:18px;height:18px;border-radius:5px;border:2px solid var(--hc);flex:none;margin-top:1px;display:grid;place-items:center;background:transparent}

.hlchk svg{width:12px;height:12px;stroke-width:3}
.hlbody{display:grid;gap:2px;min-width:0;flex:1}
.hlbody b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlbody span{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hlbody em{font-style:normal;font-size:12px;color:var(--fg);opacity:.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.btn kbd{margin-left:4px}
#nav{position:relative;flex:none;height:30px;margin:6px 10px 2px calc(var(--headw) + 10px);border-radius:6px;background:var(--bg);border:1px solid var(--line);cursor:ew-resize;touch-action:none;user-select:none;-webkit-user-select:none}
#navTrack{position:absolute;left:0;right:0;top:7px;bottom:7px;pointer-events:none}
#navTrack i{position:absolute;top:0;bottom:0;border-radius:2px;box-shadow:inset -1px 0 rgba(0,0,0,.35)}
#navTrack u{position:absolute;top:-5px;height:3px;border-radius:2px;background:var(--trk-text);opacity:.85}
#navTrack b{position:absolute;bottom:-5px;height:3px;border-radius:2px}
#navView{position:absolute;top:1px;bottom:1px;border:1.5px solid rgba(232,234,239,.6);border-radius:5px;background:rgba(255,255,255,.07);pointer-events:none;min-width:6px}
#navPh{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--cue);pointer-events:none}
#navPh i{position:absolute;left:50%;bottom:-2px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--cue);box-shadow:0 1px 4px rgba(0,0,0,.5)}
#nav:focus-visible{outline:2px solid var(--cue);outline-offset:2px}
.clip.lifted{transform:scale(1.05);box-shadow:0 10px 24px rgba(0,0,0,.55),inset 0 0 0 2px var(--cue);z-index:9}
.dropbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.emptybtn{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;height:28px;padding-inline:10px;border-radius:6px;border:1px dashed #3a5a50;color:#8fd3b9;font-size:12px;font-weight:700;white-space:nowrap}
.emptybtn:hover{background:rgba(43,143,112,.12)}
.emptybtn svg{width:14px;height:14px}
.autob{color:var(--cue)}
.autob:hover{background:rgba(242,193,78,.12)}
#mbar button.mauto{color:var(--cue)}
.autocard{background:linear-gradient(135deg,rgba(242,193,78,.18),rgba(242,193,78,.06));color:var(--cue);border:1px solid rgba(242,193,78,.35)}
.autolinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.autolinks a{text-decoration:none;color:var(--fg)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:600;color:var(--fg);cursor:pointer;line-height:1.35}
.chk input{accent-color:var(--cue);width:17px;height:17px;flex:none;margin-top:1px}
.field .chk+.chk,.field .chk+select,.field .chk+div{margin-top:8px}
.pxbox{display:grid;gap:8px;padding:10px;border-radius:8px;background:var(--raise);margin-top:8px}
.pxbox a,.modal .note a{color:var(--cue)}
.chip-s.px{left:auto;right:5px;bottom:5px;background:#1d2129;color:#8fd3b9}
.btn[disabled]{opacity:.4;cursor:default}
.errdetail{margin:0;padding:8px 10px;border-radius:6px;background:var(--raise);font:500 12px/1.45 var(--f-mono);color:#ffb070;word-break:break-word}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:700;padding:9px 14px;border-radius:8px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.dropover{position:fixed;inset:0;z-index:40;background:rgba(242,193,78,.08);border:3px dashed var(--cue);display:grid;place-items:center;font:800 22px var(--f-brand);pointer-events:none}
#hold{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;overflow:hidden;pointer-events:none;z-index:0}
#hold video,#hold audio{position:absolute;inset:0;width:96px;height:96px;object-fit:cover}
#cv{position:relative;z-index:1}
#mbar{display:none}

@media (max-width:1100px){#app{grid-template-columns:236px minmax(0,1fr) 280px} #projName{width:170px}}
.show-sm{display:none}

/* ---------- phones & small tablets (portrait), and phones held sideways ---------- */
@media (max-width:860px), (max-height:520px) and (orientation:landscape){
  :root{--headw:44px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:48px minmax(0,1fr) 250px calc(58px + env(safe-area-inset-bottom,0px));
    grid-template-areas:"top" "stage" "tl" "bar";
    padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  #projName,.hide-sm,.hide-mob{display:none}
  .show-sm{display:inline-flex}
  /* top bar: logo mark only, save state as a dot, compact controls — everything fits at 320px */
  .topbar{gap:6px;padding-inline:10px}
  .brand .bname{display:none}
  .brand i{width:22px;height:22px}
  #projBtn{padding-inline:9px}
  .savest{font-size:0;width:8px;height:8px;border-radius:50%;background:#4a8f6a;flex:none}
  .savest[data-s="Saving…"]{background:var(--muted)}
  .savest[data-s="Not saved"],.savest[data-s="Not saving"]{background:#ff5d61}
  .topbar .ibtn{min-width:34px;padding-inline:6px}
  #exportBtn{padding-inline:11px;flex:none}
  .head span{display:none}
  .head{padding-inline:0;justify-content:center}
  .panel.sheet{position:fixed;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);bottom:calc(58px + env(safe-area-inset-bottom,0px));max-height:64%;z-index:30;border:0;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);transform:translateY(calc(100% + 80px));transition:transform .22s ease;visibility:hidden}
  .panel.sheet.open{transform:none;visibility:visible}
  .sheet-close{display:inline-flex}
  .tabs{overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  #mbar{grid-area:bar;display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
  #mbar button{flex:1;min-width:0;display:grid;justify-items:center;align-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted)}
  #mbar button.on{color:var(--cue)}
  #mbar svg{width:20px;height:20px}
  .viewer{padding:8px}
  .transport{padding:5px 10px;gap:4px}
  .tc{font-size:12px}
  .tside .pill{display:none}
  /* timeline toolbar: icons only, no slider (zoom − / +), scrolls rather than clips if ever too tight */
  .tlbar{gap:2px;padding:4px 6px;overflow-x:auto;scrollbar-width:none}
  .tlbar::-webkit-scrollbar{display:none}
  .tlbar .ibtn{min-width:34px;padding-inline:4px;flex:none}
  .tlbar .div{margin-inline:3px;flex:none}
  #zoom{display:none}
  .toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .modal{padding:16px}
  .plist{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .pthumb{height:110px}
}
/* phone held sideways: preview left, timeline right, sheets slide in from the right */
@media (max-height:520px) and (orientation:landscape){
  #app{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:44px minmax(0,1fr) calc(46px + env(safe-area-inset-bottom,0px));
    grid-template-areas:"top top" "stage tl" "bar bar"}
  #timeline{border-top:0;border-left:1px solid var(--line)}
  #mbar button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px}
  #mbar svg{width:18px;height:18px}
  .panel.sheet{top:44px;left:auto;width:min(420px,56vw);max-height:none;bottom:calc(46px + env(safe-area-inset-bottom,0px));border-top:0;border-left:1px solid var(--line);
    border-radius:14px 0 0 0;box-shadow:-14px 0 30px rgba(0,0,0,.45);transform:translateX(calc(100% + 40px))}
  .toast{bottom:calc(56px + env(safe-area-inset-bottom,0px))}
}
/* fingers need bigger grab handles than a mouse */
@media (pointer:coarse){
  .clip .h{width:16px;touch-action:none}
  .clip{touch-action:pan-x pan-y}
  .clip:not(.sel) .h{pointer-events:none}
  .ruler{touch-action:none}
  #nav{height:34px}
  .mk .mh{width:16px}
  .mk .mh.l{left:-6px}
  .ruler{height:30px}
  .trans{width:26px;height:26px;margin:-13px 0 0 -13px}
  /* iPhone zooms the page when a text field under 16px gets focus */
  input:not([type=range]):not([type=checkbox]):not([type=color]),textarea,select{font-size:16px!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

      if(o){ const file=new File([o],base+'.mp4',{type:'video/mp4',lastModified:f.lastModified}); if(await playsHere(file)) return {file,kind:'video'}; }
      if(convUI&&convUI.stopped) return {stopped:true};
      convUI.hi=0;
    }
    // anything else: re-encode to H.264
    const MAX=isIOS?1280:1920;
    const o=await run(['-map','0:v:0','-map','0:a:0?','-vf',`yadif=deint=interlaced,scale=w='min(iw,${MAX})':h='min(ih,${MAX})':force_original_aspect_ratio=decrease:force_divisible_by=2,format=yuv420p`,
      '-c:v','libx264','-preset','ultrafast','-crf','23',...(ac?['-c:a','aac','-b:a','160k','-ac','2']:[]),'-movflags','+faststart','-map_metadata','0'],'out.mp4',
      `Converting ${f.name}`,'Re-encoding to MP4 on this device. Takes roughly as long as the video, sometimes longer on a phone.');
    return o?{file:new File([o],base+'.mp4',{type:'video/mp4',lastModified:f.lastModified}),kind:'video'}:{err:'failed'};
  }catch(e){ if(convUI&&convUI.stopped) return {stopped:true}; console.warn('convert',e); return {err:/memory|bounds|abort|OOM/i.test(e.message)?'memory':'failed'}; }

async function importFiles(files){
  const ok=[];
  for(const f of files){
    const kind=kindOf(f);
    if(!kind){ toast(`${f.name} isn't a video, audio or image file`); continue; }
    const m={id:uid(),name:f.name.replace(/\.[^.]+$/,''),kind,url:URL.createObjectURL(f),added:Date.now()};
    let use=f, opened=false;
    try{ await probe(m,f); opened=true; }catch(e){}
    if(!opened && kind!=='image'){   // the browser can't play it as-is: convert it on the device
      URL.revokeObjectURL(m.url); m.url=null;
      const c=await convertMedia(f,kind);
      if(c.stopped){ convHide(); toast(`Stopped converting ${f.name}`); break; }
      if(c.file){ m.kind=c.kind; m.url=URL.createObjectURL(c.file); m.converted=true;
        try{ await probe(m,c.file); opened=true; use=c.file; }catch(e){ URL.revokeObjectURL(m.url); } }
      if(!opened){ convHide();
        const why=c.err==='load'?'The converter couldn\u2019t be downloaded. Check your connection and try again.':c.err==='memory'?'It\u2019s too big to convert on this device. Try a shorter clip.':c.err==='unreadable'?'It doesn\u2019t look like a video or sound file.':'It couldn\u2019t be converted.';
        toast(`Couldn\u2019t open ${f.name}. ${why}`); await new Promise(r=>setTimeout(r,2600)); continue; }
    }
    else if(!opened){ toast(`Couldn't open ${f.name}. Try JPG, PNG, HEIC or WebP.`); URL.revokeObjectURL(m.url); continue; }
    const tk=await readTaken(f); m.taken=tk.t; m.takenSrc=tk.src;
    m.blob=use; media[m.id]=m; ok.push(m);
  }
  if(convUI){ convHide(); if(ok.some(m=>m.converted)) { const n=ok.filter(m=>m.converted).length; setTimeout(()=>toast(`Converted ${n} file${n>1?'s':''} so ${n>1?'they play':'it plays'} everywhere`),2600); } }
  // a batch lands on the timeline in the order it was shot, whatever order it was picked in
  ok.sort((a,b)=>(a.taken||0)-(b.taken||0));
  const added=[];
  for(const m of ok){ added.push(addMedia(m,false)); persistMedia(m); }
  if(added.length && dbOK && !askedPersist && navigator.storage && navigator.storage.persist){ askedPersist=true; navigator.storage.persist().catch(()=>{}); }
  if(pendingAutoSong){ pendingAutoSong=false; const a=ok.filter(m=>m.kind==='audio').pop(); if(a) AUTO.music=a.id; }
  if(added.length && !$('#autoModal').hidden) setTimeout(openAuto,50);
  if(added.length){ sel=added[added.length-1]; commit(); renderAll(); renderBin(); toast(`Added ${added.length} item${added.length>1?'s':''} to the timeline`); }
}

/* ---------------- export ---------------- */

/* ---- cut bridge (preview) ----
   Just before each cut, the first moments of the incoming clip are decoded straight from the file by the video hardware.
   If the phone's player isn't showing the right frame yet when the cut arrives, those frames are shown instead, and the
   clock keeps running instead of waiting, so the cut is instant. The player takes over the moment it has caught up. */
const bridges=new Map(); let bridgeUses=0, bridgeBusy=0;
const BRIDGE_SECS=.6;
function bridgeKey(c){ return `${c.mediaId}|${c.in.toFixed(3)}|${c.speed}`; }
function bridgeStart(c){ const i=P.clips.indexOf(c), dIn=i>0?trDur(P.clips[i-1],c):0; return Math.max(0,c.in-(dIn/2)*c.speed); }
async function buildBridge(c){
  const m=media[c.mediaId]; if(!m||m.kind!=='video'||!m.blob||!window.VideoDecoder) return;
  const key=bridgeKey(c), old=bridges.get(c.id); if(old && old.key===key) return;
  if(old) dropBridge(c.id);
  if(bridgeBusy>=1) return;            // one at a time, so it never competes with playback
  const br={key,ready:false,frames:[],src0:bridgeStart(c),src1:0}; br.src1=br.src0+BRIDGE_SECS*c.speed+(c.in-br.src0); bridges.set(c.id,br);
  bridgeBusy++; let d=null;
  try{
    d=await FrameDecoder.open(m); if(!d){ br.failed=true; return; }
    const lim=640; let last=-1;
    for(let t=br.src0;t<=br.src1+1e-3;t+=1/60){
      if(bridges.get(c.id)!==br) return;   // the edit changed while decoding
      const f=await d.frameAt(t); if(!f || f.timestamp===last) continue; last=f.timestamp;
      const fw=f.displayWidth, fh=f.displayHeight, k=Math.min(1,lim/Math.max(fw,fh)), cc=document.createElement('canvas');
      cc.width=Math.max(2,Math.round(fw*k)); cc.height=Math.max(2,Math.round(fh*k)); cc.getContext('2d').drawImage(f,0,0,cc.width,cc.height);
      br.frames.push({t:f.timestamp/1e6,img:cc,fw,fh});
    }
    br.ready=br.frames.length>0;
  }catch(e){ br.failed=true; }
  finally{ bridgeBusy--; if(d) d.close(); }
}
function dropBridge(id){ const br=bridges.get(id); if(!br) return; br.frames.forEach(f=>{ f.img.width=f.img.height=0; }); bridges.delete(id); }
function bridgeFrame(c,local){
  const br=bridges.get(c.id); if(!br||!br.ready||br.key!==bridgeKey(c)) return null;
  const st=c.in+local*c.speed; if(st<br.src0-.02||st>br.frames[br.frames.length-1].t+.05) return null;
  let f=br.frames[0]; for(const x of br.frames){ if(x.t<=st+.001) f=x; else break; } return f;
}
// is the phone's player really showing (about) the right frame right now?
function playerOnTime(r,c,local){ if(!r) return false; const el=r.el, st=c.in+local*c.speed;
  return el.readyState>=2 && !el.seeking && el.videoWidth && (!playing || !el.paused) && Math.abs(el.currentTime-st)<.07; }
function tendBridges(){
  if(!playing||exporting){ return; }
  const cs=P.clips; layout();
  for(const c of cs){ const ahead=c._s-T;
    if(ahead>-.3 && ahead<3.5){ if(!bridges.has(c.id)||bridges.get(c.id).key!==bridgeKey(c)) buildBridge(c); } }
  for(const id of [...bridges.keys()]){ const c=cs.find(x=>x.id===id); if(!c || T>c._s+BRIDGE_SECS+1 || c._s-T>6) dropBridge(id); }
}

/* ---------------- frame-exact export ----------------
   Export no longer records the preview as it plays (any hiccup on the phone ended up in the file). Instead every frame
   is built one at a time: each clip's exact frame is decoded by the phone's video hardware, drawn, and handed to the
   video encoder; sound is mixed separately with sample accuracy. Cuts land on the exact frame, however busy the phone is. */
const MP4={
  four:(u,p)=>String.fromCharCode(u[p],u[p+1],u[p+2],u[p+3]),
  kids(u,dv,start,end){ const out=[]; let p=start;
    while(p+8<=end){ let size=dv.getUint32(p), hs=8; const type=MP4.four(u,p+4);
      if(size===1){ size=Number(dv.getBigUint64(p+8)); hs=16; } else if(size===0) size=end-p;
      if(size<8||p+size>end) break; out.push({type,start:p,body:p+hs,end:p+size}); p+=size; }

    const kick=(t%.5)<.12?Math.sin(TAU*(55+140*Math.exp(-(t%.5)*40))*(t%.5))*Math.exp(-(t%.5)*25):0;

}

const pxKey=()=>{ try{ return localStorage.getItem('splice.pxkey')||''; }catch(e){ return ''; } };
let autoRun=null;

function userMedia(kind){ return Object.values(media).filter(m=>m.kind===kind && !m.sample); }
function footageSecs(){ return userMedia('video').reduce((a,m)=>a+(isFinite(m.dur)?m.dur:0),0); }

/* ---- 1. look at a video ---- */
async function analyseVideoMedia(m,onProg,run){
  if(m.analysis && m.analysis.v===1 && Math.abs(m.analysis.dur-m.dur)<.5) return m.analysis;
  const v=document.createElement('video'); v.muted=true; v.playsInline=true; v.setAttribute('playsinline',''); v.preload='auto'; v.src=m.url;
  v.style.cssText='position:fixed;left:0;top:0;width:4px;height:4px;opacity:.01;pointer-events:none'; document.body.appendChild(v);
  const S=[]; let prev=null;
  try{
    await readyFrame(v,15000);
    const dur=m.dur, sw=v.videoWidth||16, sh=v.videoHeight||9, w=64, h=Math.max(8,Math.round(64*sh/sw));
    const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d',{willReadFrequently:true});
    const grab=t=>{
      g.drawImage(v,0,0,w,h); const d=g.getImageData(0,0,w,h).data, Y=new Float32Array(w*h);
      let ys=0, sat=0, sharp=0, diff=0;
      for(let i=0,j=0;i<d.length;i+=4,j++){ const r=d[i],gg=d[i+1],b=d[i+2]; const y=.299*r+.587*gg+.114*b; Y[j]=y; ys+=y; const mx=Math.max(r,gg,b), mn=Math.min(r,gg,b); sat+=mx?(mx-mn)/mx:0; }
      for(let yy=0;yy<h-1;yy++) for(let x=0;x<w-1;x++){ const j=yy*w+x; sharp+=Math.abs(Y[j+1]-Y[j])+Math.abs(Y[j+w]-Y[j]); }
      if(prev){ for(let j=0;j<Y.length;j++) diff+=Math.abs(Y[j]-prev[j]); diff/=Y.length; }
      prev=Y; S.push({t,y:ys/Y.length/255,sat:sat/Y.length,sharp:sharp/((w-1)*(h-1))/255,diff:diff/255});
    };
    const useRVFC='requestVideoFrameCallback' in HTMLVideoElement.prototype;
    let done=false;
    if(useRVFC){
      try{ v.playbackRate=4; }catch(e){}
      await new Promise(res=>{
        let last=-1, watchdog=null; const finish=()=>{ if(done) return; done=true; clearTimeout(watchdog); v.pause(); res(); };
        const arm=()=>{ clearTimeout(watchdog); watchdog=setTimeout(finish,5000); };
        const cb=(now,meta)=>{ if(done) return; if(run.cancel) return finish(); const t=meta.mediaTime;
          if(t-last>=.2){ grab(t); last=t; onProg(Math.min(1,t/dur)); }
          if(t>=dur-.1) return finish(); arm(); v.requestVideoFrameCallback(cb); };
        v.addEventListener('ended',finish,{once:true});
        v.requestVideoFrameCallback(cb); arm(); v.play().catch(()=>finish());
      });
    }
    // no frame callbacks (or playback stalled): step through by seeking instead
    const lastT=S.length?S[S.length-1].t:-1;
    if(!useRVFC || lastT<dur-1.5){
      prev=null; if(lastT>0 && S.length) prev=null;
      for(let t=Math.max(0,lastT+.5);t<dur-.05;t+=.5){ if(run.cancel) break; v.currentTime=t; await waitEvt(v,'seeked','error',6000).catch(()=>{}); grab(t); onProg(Math.min(1,t/dur)); }
    }
  }finally{ v.removeAttribute('src'); v.load(); v.remove(); }
  if(run.cancel) return null;
  // loudness from the soundtrack (skipped for very large files to spare the phone's memory)
  let loud=null;
  if(m.blob && m.blob.size<(isIOS?80e6:160e6)){
    try{ const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext; const ab=await new OAC(1,44100,44100).decodeAudioData(await m.blob.arrayBuffer());
      const ch=ab.getChannelData(0), sr=ab.sampleRate, N=Math.ceil(m.dur); loud=new Array(N).fill(0);
      for(let s=0;s<N;s++){ const a=Math.floor(s*sr), b=Math.min(ch.length,Math.floor((s+1)*sr)); let pk=0;
        for(let i=a;i<b;i+=Math.floor(sr/20)){ let sum=0; const e=Math.min(b,i+Math.floor(sr/20)); for(let k=i;k<e;k+=4) sum+=ch[k]*ch[k]; pk=Math.max(pk,Math.sqrt(sum/Math.max(1,(e-i)/4))); }
        loud[s]=pk; }
    }catch(e){ loud=null; }
  }

  const N=Math.max(1,Math.ceil(m.dur)), A={v:1,dur:m.dur,motion:[],sharp:[],bright:[],sat:[],loud,cuts:[]};
  const diffs=S.map(s=>s.diff).filter(x=>x>0).sort((a,b)=>a-b), med=diffs[Math.floor(diffs.length/2)]||.01;
  for(let s=0;s<N;s++){ const inS=S.filter(x=>x.t>=s&&x.t<s+1); const avg=k=>inS.length?inS.reduce((a,x)=>a+x[k],0)/inS.length:0;
    A.motion.push(avg('diff')); A.sharp.push(avg('sharp')); A.bright.push(avg('y')); A.sat.push(avg('sat')); }
  S.forEach(x=>{ if(x.diff>Math.max(.12,med*6)) A.cuts.push(+x.t.toFixed(2)); });
  m.analysis=A; persistMedia(m); return A;
}

/* ---- which way is up? ----
   The camera is the authority. Phones record how they were held: videos carry an orientation tag (0° counts too)
   and photos carry EXIF, and browsers already show both the right way up. Those files are never turned here.
   Only a file with no such record (a screen recording, a WebM, a picture saved from a website) is read for clues,
   and even then only a clearly sideways shot is turned; an automatic upside-down flip is never made, because
   night skies, bright floors and sunlit grass fool any picture-only guess far more often than a shot is upside down. */
async function hasCameraPhotoInfo(m){
  if(m.camPhoto!==undefined) return m.camPhoto;
  let yes=false;
  try{ const u=new Uint8Array(await m.blob.slice(0,512*1024).arrayBuffer());
    // "Exif\0\0" (JPEG, HEIC, WebP, PNG eXIf) or an HEIF/AVIF container from a camera
    for(let i=0;i<u.length-6;i++){ if(u[i]===0x45&&u[i+1]===0x78&&u[i+2]===0x69&&u[i+3]===0x66&&u[i+4]===0&&u[i+5]===0){ yes=true; break; } }
    if(!yes && u.length>12){ const brand=String.fromCharCode(...u.slice(8,12)); if(/^(heic|heix|hevc|mif1|msf1)$/.test(brand)) yes=true; }
  }catch(e){}
  m.camPhoto=yes; return yes;
}
function upScores(src,sw,sh){
  const N=48, c=document.createElement('canvas'); c.width=N; c.height=N; const g=c.getContext('2d',{willReadFrequently:true});
  g.drawImage(src,0,0,N,N); const d=g.getImageData(0,0,N,N).data;
  const band=(x0,y0,x1,y1)=>{ let L=0,B=0,G=0,n=0; for(let y=y0;y<y1;y++) for(let x=x0;x<x1;x++){ const i=(y*N+x)*4, r=d[i], gg=d[i+1], b=d[i+2];
      L+=.299*r+.587*gg+.114*b; B+=b-(r+gg)/2; G+=gg-(r+b)/2; n++; } return {L:L/n/255,B:B/n/255,G:G/n/255}; };
  const t=band(0,0,N,N/3), bo=band(0,N*2/3,N,N), l=band(0,0,N/3,N), r=band(N*2/3,0,N,N);
  // brighter above; blue above only counts as sky when it's also bright (water and shadow are blue but dark); greener below.
  // A direction only scores if "brighter above" agrees, so side-to-side colour (a test card, a painted wall) can't turn a shot.
  // blue only ever counts *for* a sky (sunset and overcast skies aren't blue, and that mustn't count against them)
  const s=(top,bot)=>{ const dL=top.L-bot.L, dB=Math.max(0,top.B)*top.L-Math.max(0,bot.B)*bot.L, dG=bot.G-top.G; if(dL<.03) return Math.min(0,dL); return dL*1.2+dB*2.4+dG*1.6; };
  // a real scene changes most from top to bottom (sky, horizon, ground). Only call a shot sideways if its main
  // light-to-dark change runs side to side; a bright window on one side of an upright shot won't pass this.
  const rows=[],cols=[]; for(let y=0;y<N;y++){ let a=0; for(let x=0;x<N;x++){ const i=(y*N+x)*4; a+=.299*d[i]+.587*d[i+1]+.114*d[i+2]; } rows.push(a/N); }
  for(let x=0;x<N;x++){ let a=0; for(let y=0;y<N;y++){ const i=(y*N+x)*4; a+=.299*d[i]+.587*d[i+1]+.114*d[i+2]; } cols.push(a/N); }
  const vr=a=>{ const m=a.reduce((p,q)=>p+q,0)/a.length; return a.reduce((p,q)=>p+(q-m)*(q-m),0)/a.length; }, an=vr(cols)/(vr(rows)+1e-6);
  const side=an>1.2, flat=an<.85;
  // rotating clockwise by 90 brings the left edge to the top; by 270 the right edge
  return {0:s(t,bo),90:side?s(l,r):0,180:flat?s(bo,t):0,270:side?s(r,l):0};
}
async function detectUp(m){
  await checkRotation(m);
  if(m.orient && m.orient.v===6) return m.orient;
  if(m.orient && !m.rotUser) m.rot=0;      // an earlier automatic turn may have been based on an unturned picture: start again
  const trusted = m.kind==='video' ? !!m.metaTag : await hasCameraPhotoInfo(m);
  if(trusted){ m.orient={v:6,rot:0,trusted:true}; persistMedia(m); return m.orient; }
  const votes={0:0,90:0,180:0,270:0}; let frames=0;
  const tally=sc=>{ const k=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]); const best=k[0], second=sc[k[1]];
    frames++;
    if(sc[0]>.06){ votes[0]++; return; }      // already looks upright (lighter above than below): never turn it
    if(sc[best]>.08 && sc[best]-Math.max(second,0)>.06) votes[best]++; };
  if(m.kind==='image'){ if(m.img) tally(upScores(m.img,m.w,m.h)); }
  else {
    const v=document.createElement('video'); v.src=m.url; v.style.cssText='position:fixed;left:0;top:0;width:4px;height:4px;opacity:.01;pointer-events:none'; document.body.appendChild(v);
    try{ await readyFrame(v,12000); const n=Math.min(8,Math.max(3,Math.round(m.dur/4)));
      const [sw2,sh2]=shownSize(m,v), uc=document.createElement('canvas'); uc.width=Math.round(64*Math.min(1,sw2/sh2)); uc.height=Math.round(64*Math.min(1,sh2/sw2)); const ug=uc.getContext('2d');
      for(let k=0;k<n;k++){ v.currentTime=Math.min(m.dur-.1,(k+.5)*m.dur/n); await waitEvt(v,'seeked','error',6000).catch(()=>{}); if(v.readyState>=2){ drawUpright(ug,v,m,0,0,uc.width,uc.height); tally(upScores(uc,uc.width,uc.height)); } } }
    catch(e){} finally{ v.removeAttribute('src'); v.load(); v.remove(); }
  }
  // decide: a turn needs a clear majority of the frames, not just a slight lean
  const need=m.kind==='image'?1:Math.max(3,Math.ceil(frames*.75));
  let rot=0; for(const k of [90,270]) if(votes[k]>=need && votes[k]>=votes[0]*3 && votes[k]>(votes[90]+votes[270]-votes[k])*3) rot=+k;
  m.orient={v:6,rot,votes,frames}; persistMedia(m); return m.orient;
}

/* ---- 2. find the beat of the song ---- */
async function analyseMusic(m){
  if(m._beats) return m._beats;
  const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  const ab=await new OAC(1,44100,44100).decodeAudioData(await m.blob.arrayBuffer());
  const ch=ab.getChannelData(0), sr=ab.sampleRate, hop=512, n=Math.floor(ch.length/hop), fps=sr/hop;
  const e=new Float32Array(n); for(let i=0;i<n;i++){ let s=0; for(let k=i*hop;k<(i+1)*hop;k+=2) s+=ch[k]*ch[k]; e[i]=Math.log(1+1000*s); }
  const o=new Float32Array(n); for(let i=1;i<n;i++) o[i]=Math.max(0,e[i]-e[i-1]);
  const lo=Math.floor(fps*60/170), hi=Math.ceil(fps*60/72); let best=lo, bv=-1;
  for(let l=lo;l<=hi;l++){ let s=0; for(let i=0;i+l<n;i++) s+=o[i]*o[i+l]; const bpm=60*fps/l; s*=1+.12*Math.exp(-Math.pow((bpm-118)/28,2)); if(s>bv){bv=s;best=l;} }
  let ph=0, pv=-1; for(let p=0;p<best;p++){ let s=0; for(let i=p;i<n;i+=best) s+=o[i]; if(s>pv){pv=s;ph=p;} }
  const period=best/fps, beats=[]; for(let t=ph/fps;t<ab.duration;t+=period) beats.push(t);
  return m._beats={bpm:Math.round(60/period),beats,dur:ab.duration,period};
}

/* ---- 3. B-roll from Pixabay (needs the viewer's own free API key) ---- */
async function pixabayBroll(key,q,n,onStep){
  const cacheKey='splice.px.'+q.toLowerCase(); let j=null;
  try{ const c=JSON.parse(localStorage.getItem(cacheKey)||'null'); if(c && Date.now()-c.at<864e5) j=c.j; }catch(e){}   // Pixabay asks for 24 h caching
  if(!j){
    const r=await fetch(`https://pixabay.com/api/videos/?key=${encodeURIComponent(key)}&q=${encodeURIComponent(q)}&per_page=20&safesearch=true&video_type=film`);
    if(r.status===400||r.status===401||r.status===403) throw new Error('key'); if(!r.ok) throw new Error('http');
    j=await r.json(); try{ localStorage.setItem(cacheKey,JSON.stringify({at:Date.now(),j})); }catch(e){}
  }
  const hits=(j.hits||[]).filter(h=>h.duration>=4 && h.videos).slice(0,n), out=[];
  for(const h of hits){
    onStep(`Downloading B-roll ${out.length+1} of ${hits.length}`);
    const f=(h.videos.small&&h.videos.small.url)?h.videos.small:h.videos.tiny; if(!f||!f.url) continue;
    const b=await (await fetch(f.url)).blob();
    const tag=(h.tags||'b-roll').split(',')[0].trim();
    const m={id:uid(),name:`Pixabay · ${tag}`,kind:'video',url:URL.createObjectURL(b),blob:b,added:Date.now(),pixabay:true,credit:h.user,pageURL:h.pageURL};
    try{ await probe(m); }catch(e){ continue; }
    media[m.id]=m; await persistMedia(m); out.push(m);
  }
  return out;
}

/* ---- 4. choose the moments ---- */
function pctFn(values){ const s=values.filter(x=>x!=null&&isFinite(x)).sort((a,b)=>a-b); return x=>{ if(!s.length) return .5; let lo=0,hi=s.length; while(lo<hi){ const mid=(lo+hi)>>1; if(s[mid]<x) lo=mid+1; else hi=mid; } return lo/s.length; }; }
// how far above normal a value is (0 = typical, 1 = among the strongest), so near-identical quiet seconds don't rank as "interesting"
function salFn(values){ const s=values.filter(x=>x!=null&&isFinite(x)).sort((a,b)=>a-b); if(!s.length) return ()=>0;
  const p50=s[Math.floor(s.length*.5)], p95=s[Math.min(s.length-1,Math.floor(s.length*.95))]; return x=>clamp((x-p50)/Math.max(1e-6,p95-p50),0,1); }
function scoreVideos(vids){
  const all=k=>vids.flatMap(m=>(m.analysis&&m.analysis[k])||[]);
  const Pm=pctFn(all('motion')), Ps=pctFn(all('sharp')), Pc=pctFn(all('sat')), Pl=pctFn(vids.flatMap(m=>m.analysis.loud||[]));
  const Sm=salFn(all('motion')), Sl=salFn(vids.flatMap(m=>m.analysis.loud||[]));
  for(const m of vids){ const A=m.analysis, N=A.motion.length, sc=[];
    for(let i=0;i<N;i++){
      const pm=Pm(A.motion[i]), ps=Ps(A.sharp[i]), pc=Pc(A.sat[i]), b=A.bright[i];
      let s=A.loud? .45*pm+.3*Pl(A.loud[i])+.15*ps+.1*pc : .6*pm+.25*ps+.15*pc;
      if(b<.1||b>.95) s-=.4; if(ps<.1) s-=.25; if(pm>.97&&ps<.3) s-=.2; if(i===0) s-=.15;
      sc.push(s); }
    A.score=sc.map((x,i)=>(( sc[i-1]??x)+2*x+(sc[i+1]??x))/4);
    // how much is actually happening: movement or sound clearly above this footage's norm
    const it=i=>Math.max(Sm(A.motion[i]),A.loud?Sl(A.loud[i]):0);
    A.interest=A.motion.map((x,i)=>((i>0?it(i-1):it(i))+2*it(i)+(i<N-1?it(i+1):it(i)))/4);
    A.calm=A.motion.map((x,i)=>{ const pm=Pm(x), ps=Ps(A.sharp[i]), b=A.bright[i]; return (b>.15&&b<.9)? (1-pm)*.5+ps*.5 : 0; });
  }
}
function pickMoments(vids,budget,pace,must){
  // only real moments make the cut: clearly above-average action or sound. Better a shorter video than filler.
  const allS=vids.flatMap(m=>m.analysis.score).sort((a,b)=>a-b), floor=Math.max(.3,allS[Math.floor(allS.length*.6)]||0);
  const cands=[];
  for(const m of vids){ const A=m.analysis, sc=A.score, N=sc.length;
    for(let i=0;i<N;i++){ let peak=true; for(let k=-2;k<=2;k++) if(k&&sc[i+k]!=null&&sc[i+k]>sc[i]) peak=false;
      if(peak && sc[i]>=floor && A.interest[i]>=.3) cands.push({m,i,s:sc[i]}); } }
  if(!cands.length) for(const m of vids){ const sc=m.analysis.score; let bi=0; sc.forEach((x,i)=>{ if(x>sc[bi]) bi=i; }); cands.push({m,i:bi,s:sc[bi]}); }  // nothing stands out: take each video's best
  const segOf=c=>{ const A=c.m.analysis, L=clamp(pace.len*(.8+.5*clamp(c.s,0,1)),pace.min,pace.max), pk=c.i+.5;
    let a=Math.max(.15,pk-.6*L), b=Math.min(c.m.dur-.05,a+L); a=Math.max(0,b-L);
    for(const ct of A.cuts){ if(ct>a&&ct<=pk) a=ct+.05; if(ct>pk&&ct<b) b=ct-.05; }
    return b-a>=pace.min*.75?{m:c.m,a,b,s:c.s}:null; };
  const chosen=[...must], overlaps=x=>chosen.some(y=>y.m===x.m && x.a<y.b+.75 && x.b>y.a-.75);
  let total=chosen.reduce((t,x)=>t+(x.b-x.a),0);
  const byVid=new Map(); cands.forEach(c=>{ if(!byVid.has(c.m)||byVid.get(c.m).s<c.s) byVid.set(c.m,c); });
  for(const c of [...byVid.values()].sort((a,b)=>b.s-a.s)){ if(total>=budget) break; const x=segOf(c); if(x&&!overlaps(x)){ chosen.push(x); total+=x.b-x.a; } }  // every video gets its best moment
  for(const c of cands.sort((a,b)=>b.s-a.s)){ if(total>=budget) break; const x=segOf(c); if(x&&!overlaps(x)){ chosen.push(x); total+=x.b-x.a; } }
  const when=m=>m.taken||m.added||0;
  return chosen.sort((x,y)=>(when(x.m)-when(y.m))||(x.m===y.m?x.a-y.a:0));
}
function calmShots(vids,chosen,n){
  const out=[];
  for(const m of vids){ const A=m.analysis; if(!A||!A.calm) continue;
    for(let i=1;i<A.calm.length-2;i++){ const a=i, b=Math.min(m.dur-.05,i+2.6);
      if(A.calm[i]>.62 && !chosen.some(y=>y.m===m&&a<y.b+1.5&&b>y.a-1.5) && !A.cuts.some(c=>c>a&&c<b)) out.push({m,a,b,s:A.calm[i],broll:true}); } }
  const picked=[]; for(const c of out.sort((x,y)=>y.s-x.s)){ if(picked.length>=n) break; if(!picked.some(p=>p.m===c.m&&Math.abs(p.a-c.a)<6)) picked.push(c); }
  return picked;
}

/* ---- 5. put it together ---- */
async function buildAutoEdit(opts,ui){
  const run={cancel:false}; autoRun=run;
  const pace=PACE[opts.pace]||PACE.balanced;
  const vids=userMedia('video').filter(m=>!m.pixabay), photos=userMedia('image');
  if(!vids.length && !photos.length) throw new Error('nomedia');
  // how long?
  let target=Math.min(300,opts.len);
  let song=opts.music?media[opts.music]:null, beat=null;
  if(song){ ui.step('Finding the beat of your song'); try{ beat=await analyseMusic(song); }catch(e){ beat=null; }
    if(beat && beat.dur>=20) target=Math.min(target,beat.dur); }
  ui.prog(.06);
  // look at every video
  const totalSecs=vids.reduce((a,m)=>a+m.dur,0)||1; let doneSecs=0; const failed=[];
  for(const [i,m] of vids.entries()){
    ui.step(`Watching video ${i+1} of ${vids.length}: ${m.name}`);
    try{ await analyseVideoMedia(m,f=>ui.prog(.06+.72*Math.min(1,(doneSecs+Math.min(1,f)*m.dur)/totalSecs)),run); }
    catch(e){ console.warn('analysis failed',m.name,e); failed.push(m); ui.note(`Couldn\u2019t study \u201c${m.name}\u201d (${e&&e.message||'unknown reason'}), so evenly spaced moments from it were used.`); }
    if(run.cancel) return null; doneSecs+=m.dur; ui.prog(.06+.72*Math.min(1,doneSecs/totalSecs));
  }
  ui.prog(.78);
  // turn sideways or upside-down shots the right way up (never overriding a turn you made yourself)
  const turned=[];
  if(opts.upright!==false){
    ui.step('Checking which way up each shot is');
    const all=[...vids,...photos]; let k=0;
    for(const m of all){ if(run.cancel) return null; ui.prog(.78+.1*(k++)/all.length); if(m.rotUser) continue;
      try{ const o=await detectUp(m); if(o.rot && (m.rot||0)!==o.rot){ m.rot=o.rot; persistMedia(m); turned.push(m); } }catch(e){} }
  }
  ui.prog(.88);
  // B-roll
  let pxClips=[];
  if(opts.px && pxKey() && opts.pxQ.trim()){
    ui.step('Fetching B-roll from Pixabay');
    try{ pxClips=await pixabayBroll(pxKey(),opts.pxQ.trim(),Math.min(4,Math.max(2,Math.round(target/40))),s=>ui.step(s)); }
    catch(e){ ui.note(e.message==='key'?'Pixabay didn’t accept the API key, so no Pixabay B-roll was added.':'Pixabay couldn’t be reached from here, so no Pixabay B-roll was added. It works in your GitHub version.'); }
    for(const m of pxClips) m.analysis=null;
  }
  if(run.cancel) return null;
  ui.step('Choosing the best moments'); ui.prog(.9);
  const vidsOK=vids.filter(m=>m.analysis && !failed.includes(m));
  if(vidsOK.length) scoreVideos(vidsOK);
  // your own highlights (Marks) are always kept
  const must=[];
  if(opts.marks) for(const h of P.marks||[]){ const c=P.clips.find(x=>x.id===h.clipId), m=c&&media[c.mediaId]; if(m&&m.kind==='video'&&vidsOK.includes(m)&&h.out-h.in>.4) must.push({m,a:h.in,b:h.out,s:1,must:true}); }
  const wantBroll=opts.broll||pxClips.length;
  const brollShare=wantBroll?.18:0;
  const title=opts.title?Math.min(3,pace.len):0;
  let moments=vidsOK.length?pickMoments(vidsOK,Math.max(pace.len,(target-title)*(1-brollShare)),pace,must):[];
  // videos that couldn't be studied: take a few evenly spaced moments so they're still represented
  for(const m of failed){ const n=clamp(Math.round(m.dur/20),1,4), L=Math.min(pace.len,m.dur);
    for(let k=0;k<n;k++){ const a=Math.max(0,(m.dur-L)*(k+.5)/n); moments.push({m,a,b:Math.min(m.dur-.05,a+L),s:.5}); } }
  if(failed.length){ const when=m=>m.taken||m.added||0; moments.sort((x,y)=>(when(x.m)-when(y.m))||(x.m===y.m?x.a-y.a:0)); }
  const anyVid=vidsOK.length||failed.length;
  // B-roll pool: Pixabay clips, then your photos, then calm, steady shots from your own videos
  const pool=[];
  pxClips.forEach(m=>pool.push({m,a:Math.min(1,m.dur*.2),b:Math.min(m.dur-.05,Math.min(1,m.dur*.2)+3.2),broll:true}));
  if(opts.broll){ photos.sort((a,b)=>(a.taken||a.added||0)-(b.taken||b.added||0)).forEach(m=>pool.push({m,a:0,b:2.6,broll:true,photo:true}));
    if(vidsOK.length) calmShots(vidsOK,moments,3).forEach(x=>pool.push(x)); }
  if(!vidsOK.length && !failed.length) photos.forEach(m=>{ if(!pool.some(p=>p.m===m)) pool.push({m,a:0,b:pace.len,broll:false,photo:true}); });
  // sequence: an opener, then moments with B-roll woven in
  const seq=[];
  if(anyVid){
    if(pool.length) seq.push(pool.shift());
    moments.forEach((x,i)=>{ seq.push(x); if(pool.length && (i+1)%pace.every===0 && i<moments.length-1) seq.push(pool.shift()); });
    if(pool.length && seq.length>3) seq.push(pool.shift());
  } else { pool.forEach(x=>seq.push({...x,broll:false})); }
  // trim to the target (keep the must-haves), longest-first
  let len=()=>seq.reduce((t,x)=>t+(x.b-x.a),0);
  while(len()>target && seq.length>2){ let k=-1, kl=0; seq.forEach((x,i)=>{ if(!x.must && x.b-x.a>kl){ kl=x.b-x.a; k=i; } });
    const x=seq[k], over=len()-target; if(x.b-x.a-over>=pace.min){ x.b-=over; break; } seq.splice(k,1); }
  // snap each cut to the nearest beat
  if(beat){ let t=0; for(const x of seq){ const L=x.b-x.a, maxL=x.photo?L*1.6:Math.min(x.m.dur-.05-x.a,L*1.35)+0, minL=Math.max(.8,L*.6);
      let bestB=null, bd=1e9; for(const bt of beat.beats){ const d=bt-t; if(d<minL) continue; if(d>maxL) break; if(Math.abs(d-L)<bd){ bd=Math.abs(d-L); bestB=bt; } }
      if(bestB!=null){ x.b=x.a+(bestB-t); } t+=x.b-x.a; } }
  if(run.cancel) return null;
  // ---- write it as a new project ----
  ui.step('Assembling your video'); ui.prog(.96);
  const baseName=($('#projName').value||'My video').replace(/ · Auto edit$/,'');
  const keep={aspect:P.aspect,bg:P.bg,style:P.style,amt:P.amt,warm:P.warm,letterbox:P.letterbox};
  const curFilter=(P.clips[0]&&P.clips[0].filter)||'none';
  const st=opts.style!=='keep'?STYLES.find(s=>s.id===opts.style):null;
  await saveNow(); const origId=curId;
  curId=uid(); curCreated=Date.now(); $('#projName').value=baseName+' · Auto edit'; hist=[]; hi=-1; sel=null;
  const clips=[]; let pi=0;
  seq.forEach((x,i)=>{
    const c=newClip(x.m); c.in=x.a; c.out=x.photo?x.a+(x.b-x.a):x.b; if(x.photo){ c.in=0; c.out=x.b-x.a; c.motion=pi++%2?'zoomOut':'zoomIn'; }
    c.volume=x.broll?0:(song?.35:1); c.filter=st?st.filter:curFilter;
    const next=seq[i+1]; const soft=x.broll||(next&&next.broll)||pace.cut==='fade';
    // straight cuts between action moments (on the beat); a softer transition into and out of B-roll
    const softType=st&&st.tr&&st.tr!=='none'?st.tr:'fade';
    c.tr= next? (soft? {type:softType,dur:.5} : {type:'none',dur:.35}) : {type:'none',dur:.5};
    clips.push(c);
  });
  P={...keep,clips,texts:[],audio:[],marks:[]};
  if(st){ P.style=st.id; P.letterbox=!!st.letterbox; P.amt=100; }
  layout(); const vlen=videoEnd();
  if(opts.title){
    const dates=seq.map(x=>x.m.taken).filter(Boolean).sort((a,b)=>a-b);
    P.texts.push({id:uid(),text:baseName.toUpperCase(),start:.25,dur:Math.min(3.2,Math.max(1.5,vlen-.3)),x:.5,y:.42,size:96,color:'#ffffff',font:'anton',style:'shadow',bg:'#000000',anim:'pop',italic:false});
    if(dates.length) P.texts.push({id:uid(),text:new Date(dates[0]).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}).toUpperCase(),start:.7,dur:Math.min(2.8,Math.max(1,vlen-.8)),x:.5,y:.56,size:30,color:'#111111',font:'mono',style:'box',bg:'#f2c14e',anim:'type',italic:false});
  }
  if(song){ const d=Math.min(song.dur,vlen); P.audio.push({id:uid(),mediaId:song.id,start:0,in:0,out:d,volume:.9,fadeIn:.4,fadeOut:Math.min(3,d/4)}); }
  T=0; applyAspect(false); commit(); await saveNow(); renderAll(); renderLeft(); requestAnimationFrame(()=>fitZoom());
  const usedVids=new Set(seq.filter(x=>!x.broll&&!x.photo).map(x=>x.m.id)).size;
  return {turned:turned.map(m=>m.name), len:vlen, moments:seq.filter(x=>!x.broll).length, videos:usedVids, broll:seq.filter(x=>x.broll).length, px:pxClips, song:song?song.name:null, bpm:beat?beat.bpm:null, origId,
          footage:Math.round(totalSecs)};
}

/* ---- the Auto edit screen ---- */
function openAuto(){
  setPlaying(false); closeSheets();
  const vids=userMedia('video').filter(m=>!m.pixabay), photos=userMedia('image'), songs=userMedia('audio');
  if(AUTO.music && !media[AUTO.music]) AUTO.music='';
  if(!AUTO.music && songs.length) AUTO.music=songs[0].id;
  const foot=footageSecs(), suggest=[30,60,120,180,300].find(x=>x>=Math.min(300,foot*.25))||300;
  if(!AUTO._touched) AUTO.len=Math.min(suggest,300);
  const pace=PACE[AUTO.pace], mood=encodeURIComponent(pace.mood);
  const hasKey=!!pxKey();
  $('#autoBody').innerHTML=`
    ${vids.length||photos.length?'':'<!--none-->'}<p class="note" style="margin:0${!vids.length&&!photos.length?';display:none':''}">Uses the ${vids.length} video${vids.length===1?'':'s'}${photos.length?` and ${photos.length} photo${photos.length===1?'':'s'}`:''} in this project${foot?` (${fmtD(foot)} of footage)`:''}. It picks the best moments, cuts them to your song and adds B-roll. Your current edit stays as it is; the result opens as a new project.</p>
    ${!vids.length&&!photos.length?'<p class="note" style="color:#ff8a8d;margin:0">Import your videos or photos first, then come back here.</p>':''}
    ${field('Length',`<div class="chips">${[[30,'30 s'],[60,'1 min'],[120,'2 min'],[180,'3 min'],[300,'5 min']].map(([v,n])=>`<button class="chip${AUTO.len===v?' on':''}" data-al="${v}">${n}</button>`).join('')}</div><p class="note" style="margin:6px 0 0">Maximum. It will be shorter if there isn’t enough good footage, or if your song ends first.</p>`)}
    ${field('Pace',`<div class="chips">${Object.entries(PACE).map(([k,p])=>`<button class="chip${AUTO.pace===k?' on':''}" data-ap="${k}">${p.name}</button>`).join('')}</div>`)}
    ${field('Music',`<select id="autoMusic" class="lblin"><option value="">No music (keep the original sound)</option>${songs.map(s=>`<option value="${s.id}"${AUTO.music===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}</select>
      <div class="autolinks"><button class="btn" id="autoAddSong">${ICON.music}Add a song</button><a class="btn ghost" href="https://pixabay.com/music/search/${mood}/" target="_blank" rel="noopener">Find ${esc(pace.mood)} songs on Pixabay ↗</a></div>
      <p class="note" style="margin:6px 0 0">Pixabay doesn’t let apps fetch its music, so download a song there, then tap <b>Add a song</b>. Cuts will land on its beat.</p>`)}
    ${field('B-roll',`<label class="chk"><input type="checkbox" id="autoBroll"${AUTO.broll?' checked':''}> Use my photos and calm, steady shots between moments</label>
      <label class="chk"><input type="checkbox" id="autoPx"${AUTO.px?' checked':''}> Add B-roll videos from Pixabay</label>
      <div id="pxBox"${AUTO.px?'':' hidden'} class="pxbox">
        <input class="lblin" id="autoPxQ" placeholder="What to search for, e.g. soccer stadium" value="${esc(AUTO.pxQ)}" maxlength="60">
        <input class="lblin" id="autoPxKey" placeholder="Your free Pixabay API key" value="${esc(pxKey())}" autocomplete="off" spellcheck="false">
        <p class="note" style="margin:0">${hasKey?'Key saved on this device only.':'Get a free key: sign in at Pixabay and open'} <a href="https://pixabay.com/api/docs/" target="_blank" rel="noopener">pixabay.com/api/docs</a>${hasKey?'':'. It’s shown near the top as “key”. Saved on this device only.'}</p></div>`)}
    ${field('Extras',`<label class="chk"><input type="checkbox" id="autoUpright"${AUTO.upright!==false?' checked':''}> Turn sideways or upside-down shots the right way up</label>
      <label class="chk"><input type="checkbox" id="autoTitle"${AUTO.title?' checked':''}> Opening title using the project name</label>
      ${(P.marks||[]).length?`<label class="chk"><input type="checkbox" id="autoMarks"${AUTO.marks?' checked':''}> Always include my ${P.marks.length} highlight${P.marks.length===1?'':'s'}</label>`:''}
      <select id="autoStyle" class="lblin"><option value="keep">Keep this project’s look</option>${STYLES.map(s=>`<option value="${s.id}"${AUTO.style===s.id?' selected':''}>Style: ${s.name}</option>`).join('')}</select>`)}
    <div class="mfoot"><button class="btn ghost" data-autoclose>Cancel</button><button class="btn primary" id="autoGo"${!vids.length&&!photos.length?' disabled':''}>${ICON.spark}Create my video</button></div>`;
  $('#autoModal').hidden=false;
}
function readAutoForm(){
  const q=id=>document.getElementById(id);
  AUTO.music=q('autoMusic')?q('autoMusic').value:''; AUTO.broll=!!(q('autoBroll')&&q('autoBroll').checked); AUTO.px=!!(q('autoPx')&&q('autoPx').checked);
  AUTO.pxQ=q('autoPxQ')?q('autoPxQ').value:AUTO.pxQ; AUTO.title=!!(q('autoTitle')&&q('autoTitle').checked); AUTO.upright=!!(q('autoUpright')&&q('autoUpright').checked); AUTO.marks=q('autoMarks')?q('autoMarks').checked:AUTO.marks;
  AUTO.style=q('autoStyle')?q('autoStyle').value:'keep';
  const k=q('autoPxKey'); if(k){ try{ const v=k.value.trim(); v?localStorage.setItem('splice.pxkey',v):localStorage.removeItem('splice.pxkey'); }catch(e){} }
  try{ const {_touched,...s}=AUTO; localStorage.setItem('splice.auto',JSON.stringify(s)); }catch(e){}
}
async function startAuto(){
  readAutoForm();
  if(AUTO.px && (!pxKey()||!AUTO.pxQ.trim())){ toast('Add a Pixabay key and a search word, or untick Pixabay B-roll'); return; }
  const notes=[];
  $('#autoBody').innerHTML=`<div style="display:grid;gap:12px"><div class="bar"><i id="autoBar"></i></div><div class="stat"><span id="autoStep">Getting ready</span><b id="autoPct">0%</b></div>
    <p class="note" style="margin:0">Everything happens on this device. Longer footage takes longer: about a quarter of its running time. Keep this screen open.</p>
    <div class="mfoot"><button class="btn ghost" id="autoStop">Stop</button></div></div>`;
  $('#autoStop').onclick=()=>{ if(autoRun) autoRun.cancel=true; };
  let hi=0; const me={}; window.__autoUI=me;   // the bar only ever moves forward, so late reports from an earlier step can't drag it back
  const ui={step:s=>{ if(window.__autoUI!==me) return; const e=$('#autoStep'); if(e) e.textContent=s; }, prog:f=>{ if(window.__autoUI!==me || !(f>hi)) return; hi=Math.min(1,f); const b=$('#autoBar'), p=$('#autoPct'); if(b) b.style.width=(hi*100).toFixed(1)+'%'; if(p) p.textContent=Math.floor(hi*100)+'%'; }, note:n=>notes.push(n)};
  let r=null;
  try{ r=await buildAutoEdit({...AUTO},ui); }
  catch(e){ console.warn(e);
    const msg=e&&e.message||String(e), where=(e&&e.stack||'').split('\n').slice(0,2).join(' ').slice(0,160);
    $('#autoBody').innerHTML=`<p class="note" style="margin:0">${msg==='nomedia'?'Import your videos or photos first.':'Auto edit stopped before it finished, so nothing was changed.'}</p>
      ${msg!=='nomedia'?`<p class="note" style="margin:0">Last step: <b>${esc(($('#autoStep')||{}).textContent||'starting')}</b></p><p class="note errdetail">Reason: ${esc(msg)}${where?`<br><small>${esc(where)}</small>`:''}</p><p class="note" style="margin:0">If this keeps happening, send me the reason above.</p>`:''}
      <div class="mfoot"><button class="btn" data-autoclose>Close</button><button class="btn primary" id="autoRetry">Try again</button></div>`;
    const rb=$('#autoRetry'); if(rb) rb.onclick=openAuto; autoRun=null; return; }
  if(!r){ $('#autoModal').hidden=true; toast('Auto edit stopped. Nothing was changed.'); return; }
  $('#autoBody').innerHTML=`<div style="display:grid;gap:12px">
    <p style="margin:0;font:800 17px/1.3 var(--f-brand)">Your ${fmtD(r.len)} video is ready</p>
    <div class="stat">Best moments<b>${r.moments}${r.videos?` from ${r.videos} video${r.videos===1?'':'s'}`:''}</b></div>
    ${r.footage?`<div class="stat">From footage<b>${fmtD(r.footage)}</b></div>`:''}
    <div class="stat">B-roll shots<b>${r.broll}</b></div>
    ${r.turned&&r.turned.length?`<div class="stat">Turned the right way up<b>${r.turned.length} shot${r.turned.length===1?'':'s'}</b></div><p class="note" style="margin:0">${r.turned.map(n=>esc(n)).join(', ')}. If one\u2019s wrong, select it and use Left or Right in Orientation.</p>`:''}
    <div class="stat">Music<b>${r.song?esc(r.song)+(r.bpm?` · cut to ${r.bpm} BPM`:''):'Original sound'}</b></div>
    ${r.px.length?`<p class="note" style="margin:0">B-roll from Pixabay by ${[...new Set(r.px.map(m=>m.credit))].map(u=>esc(u)).join(', ')}. <a href="https://pixabay.com/" target="_blank" rel="noopener">pixabay.com</a></p>`:''}
    ${notes.map(n=>`<p class="note" style="margin:0;color:#ffb070">${esc(n)}</p>`).join('')}
    <p class="note" style="margin:0">It’s a normal project: trim, reorder or swap anything. Your original is still in Projects.</p>
    <div class="mfoot"><button class="btn ghost" id="autoBack">Back to my original</button><button class="btn primary" id="autoPlay">Watch it</button></div></div>`;
  $('#autoBack').onclick=async()=>{ $('#autoModal').hidden=true; await openProject(r.origId); };
  $('#autoPlay').onclick=()=>{ $('#autoModal').hidden=true; T=0; ensureAudio(); unlockVideos(); setPlaying(true); };
}
$('#autoModal').addEventListener('click',e=>{
  if(e.target.closest('[data-autoclose]')||e.target===e.currentTarget){ if(!autoRun||autoRun.cancel!==false||!$('#autoStop')) $('#autoModal').hidden=true; return; }
  const l=e.target.closest('[data-al]'); if(l){ AUTO.len=+l.dataset.al; AUTO._touched=true; readAutoForm(); openAuto(); return; }
  const p=e.target.closest('[data-ap]'); if(p){ AUTO.pace=p.dataset.ap; readAutoForm(); openAuto(); return; }
  if(e.target.closest('#autoAddSong')){ readAutoForm(); pendingAutoSong=true; openMusic(); return; }
  if(e.target.closest('#autoGo')) startAuto();
});
$('#autoModal').addEventListener('change',e=>{ if(e.target.id==='autoPx'){ $('#pxBox').hidden=!e.target.checked; } });
let pendingAutoSong=false;
$('#autoBtn').onclick=openAuto;

/* ---------------- boot ---------------- */
(async()=>{
  applyAspect(false); renderLeft();
  getRotMode().then(()=>{ dirty=true; });
  requestAnimationFrame(loop);
  if(document.fonts){ FONTS.forEach(f=>document.fonts.load(`${f.w} 40px ${f.fam}`).then(()=>{dirty=true}).catch(()=>{})); document.fonts.load('italic 400 40px "Instrument Serif"').catch(()=>{}); document.fonts.ready.then(()=>{dirty=true}); }
  try{ await DB.open(); dbOK=true; }catch(e){ dbOK=false; setSaveState('Not saving'); }
  if(dbOK){
    try{
      const recs=(await DB.all('projects')).sort((a,b)=>b.updated-a.updated);
      const pick=recs.find(r=>r.id===lsGet('splice.last'))||recs[0];
      if(pick){ await openProject(pick.id); return; }
    }catch(e){ console.warn('open failed',e); }
  }
  // first visit: start with the sample edit
  loadingProj=true; curId=uid(); curCreated=Date.now();
  try{ await loadSample(); }catch(e){ console.warn('sample failed',e); }
  commit(); loadingProj=false; renderAll(); renderBin();
  requestAnimationFrame(()=>fitZoom());
  T=1.2; dirty=true;
  if(dbOK){ for(const m of Object.values(media)) await persistMedia(m); setTimeout(saveNow,300); }
})();
})();
</script>
