<title>Splice Studio</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Caveat:wght@700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: editor shell — media bin | preview | inspector over a full-width multi-track timeline; phones collapse the side panels into bottom sheets. Single dark look by choice (editing suites stay dark so footage reads true). */
:root{
  color-scheme: dark;
  --bg:#0e1014; --panel:#15181e; --raise:#1d2129; --raise2:#252a34; --line:#2a303b;
  --fg:#e8eaef; --muted:#8b92a1; --dim:#5b6270;
  --cue:#f2c14e; --cue-ink:#1b1504;
  --trk-video:#35679c; --trk-text:#9656b8; --trk-audio:#2b8f70; --danger:#e5484d;
  --f-ui:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-brand:"Bricolage Grotesque", "Manrope", system-ui, sans-serif;
  --headw:84px; --r:6px;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:500 13px/1.4 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--cue);outline-offset:2px}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-columns:272px minmax(0,1fr) 304px;grid-template-rows:50px minmax(0,1fr) 260px;
  grid-template-areas:"top top top" "left stage right" "tl tl tl"}

/* top bar */
.topbar{grid-area:top;display:flex;align-items:center;gap:10px;padding-inline:14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:800 17px/1 var(--f-brand);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{width:18px;height:18px;border-radius:4px;background:
  linear-gradient(90deg,var(--trk-video) 0 45%,transparent 45% 55%,var(--trk-video) 55%);position:relative}
.brand i::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--cue)}
#projName{background:transparent;border:1px solid transparent;border-radius:var(--r);padding:5px 8px;min-width:0;width:220px;color:var(--muted)}
#projName:hover,#projName:focus{border-color:var(--line);color:var(--fg);outline:none}
.sp{flex:1}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;min-width:32px;padding-inline:8px;border-radius:var(--r);color:var(--fg)}
.ibtn:hover{background:var(--raise)}
.ibtn:disabled{opacity:.35;cursor:default;background:none}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding-inline:12px;border-radius:var(--r);background:var(--raise2);font-weight:700}
.btn:hover{background:#2e3440}
.btn.primary{background:var(--cue);color:var(--cue-ink)}
.btn.primary:hover{background:#ffd062}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{color:#ff8a8d}

/* panels */
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{grid-area:left;border-right:1px solid var(--line)}
#right{grid-area:right;border-left:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);flex:none}
.tab{padding:8px 12px;border-radius:var(--r) var(--r) 0 0;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--fg);box-shadow:inset 0 -2px var(--cue)}
.sheet-close{display:none;margin-left:auto}
.pbody{overflow:auto;padding:14px;flex:1;min-height:0}
.h6{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}

/* media bin */
.drop{border:1px dashed #3a4150;border-radius:8px;padding:14px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center;margin-bottom:14px}
.drop b{color:var(--fg)}
.bin{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{position:relative;border-radius:6px;overflow:hidden;background:var(--raise);cursor:pointer;display:flex;flex-direction:column}
.item .th{aspect-ratio:16/10;background:#0a0c10 center/cover no-repeat;position:relative;display:grid;place-items:center;color:var(--muted)}
.item .th .wave{position:absolute;inset:18% 6%;background:center/100% 100% no-repeat}
.item .meta{padding:6px 7px;display:flex;gap:6px;align-items:center;min-width:0}
.item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;flex:1;min-width:0}
.item .du{font:500 10px var(--f-mono);color:var(--muted)}
.item .kind{position:absolute;left:5px;top:5px;font:700 9px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:3px 5px;border-radius:3px;background:rgba(10,12,16,.75)}
.item .add{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:50%;background:var(--cue);color:var(--cue-ink);display:grid;place-items:center;opacity:0;transition:opacity .15s}
.item:hover .add,.item:focus-within .add{opacity:1}
@media (hover:none){.item .add{opacity:1}}
.chip-s{position:absolute;left:5px;bottom:5px;font:700 9px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--cue-ink);background:var(--cue);padding:3px 5px;border-radius:3px}

/* text presets */
.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preset{height:78px;border-radius:6px;background:linear-gradient(160deg,#28303d,#161a21);display:grid;place-items:center;padding:6px;text-align:center;line-height:1.05;overflow:hidden}
.preset:hover{outline:1px solid var(--cue)}

/* stage */
#stage{grid-area:stage;display:flex;flex-direction:column;min-height:0;min-width:0;background:
  radial-gradient(ellipse at 50% 40%,#161a22,var(--bg) 70%)}
.viewer{flex:1;min-height:0;display:grid;place-items:center;padding:16px;position:relative}
#cv{background:#000;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:3px;touch-action:none;display:block}
.transport{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--line)}
.tc{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.tc span{color:var(--dim)}
.play{width:40px;height:40px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.play svg{width:18px;height:18px;fill:currentColor;stroke:none}
.play:hover{background:#fff}
.tgroup{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.tside{flex:1;display:flex;align-items:center;gap:6px}
.tside.r{justify-content:flex-end}
.pill{font:700 11px var(--f-ui);padding:4px 8px;border-radius:99px;background:var(--raise);color:var(--muted);white-space:nowrap}

/* inspector */
.ihead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ihead .sw{width:10px;height:28px;border-radius:3px;flex:none}
.ihead .t{font:800 15px/1.2 var(--f-brand);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ihead .s{font:500 11px var(--f-mono);color:var(--muted)}
.acts{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.acts .btn{height:30px;padding-inline:10px;font-size:12px}
.sec{border-top:1px solid var(--line);padding-block:14px}
.sec:first-of-type{border-top:0;padding-top:0}
.field{display:grid;gap:6px;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field>label{font-size:12px;color:var(--muted);font-weight:600}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;min-width:0;accent-color:var(--cue)}
.slider output{font:500 11px var(--f-mono);min-width:48px;text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{padding:5px 9px;border-radius:5px;background:var(--raise);font-size:12px;font-weight:600;color:var(--muted);border:1px solid transparent}
.chip:hover{color:var(--fg)}
.chip.on{background:rgba(242,193,78,.12);color:var(--cue);border-color:rgba(242,193,78,.45)}
.fxgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.fx{display:grid;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center}
.fx span{aspect-ratio:1;border-radius:5px;background:#333 center/cover;border:2px solid transparent}
.fx.on{color:var(--cue)} .fx.on span{border-color:var(--cue)}
.trgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.trgrid .chip{padding:10px;text-align:left}
textarea{width:100%;min-height:70px;resize:vertical;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-weight:600}
.colors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.col{width:24px;height:24px;border-radius:50%;border:2px solid var(--line)}
.col.on{border-color:var(--cue);box-shadow:0 0 0 2px var(--panel) inset}
input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;border-radius:50%}
.note{color:var(--muted);font-size:12px;line-height:1.5}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12px;color:var(--muted)}
kbd{font:500 11px var(--f-mono);background:var(--raise);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--fg);justify-self:start;white-space:nowrap}
.stat{display:flex;justify-content:space-between;font-size:12px;padding-block:3px;color:var(--muted)}
.stat b{color:var(--fg);font:500 12px var(--f-mono)}

/* timeline */
#timeline{grid-area:tl;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel);min-height:0;min-width:0}
.tlbar{display:flex;align-items:center;gap:4px;padding:5px 10px;border-bottom:1px solid var(--line);flex:none}
.tlbar .div{width:1px;height:20px;background:var(--line);margin-inline:6px}
.tlbar .ibtn.on{color:var(--cue);background:rgba(242,193,78,.1)}
#zoom{width:120px;accent-color:var(--cue)}
#tls{flex:1;overflow:auto;position:relative;min-height:0;overscroll-behavior:contain}
#tli{position:relative;min-height:100%;user-select:none;-webkit-user-select:none}
.row{display:flex;position:relative}
.head{flex:0 0 var(--headw);position:sticky;left:0;z-index:6;background:var(--panel);border-right:1px solid var(--line);
  display:flex;align-items:center;gap:7px;padding-inline:10px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.head svg{width:14px;height:14px}
.track{flex:1;position:relative}
.ruler{position:sticky;top:0;z-index:7;height:26px;background:var(--panel);border-bottom:1px solid var(--line)}
.ruler .head{z-index:8}
.tick{position:absolute;bottom:0;width:1px;background:#3a414d;height:5px}
.tick.maj{height:10px;background:#566070}
.tick b{position:absolute;left:4px;bottom:9px;font:500 10px var(--f-mono);color:var(--muted);white-space:nowrap}
.lane{border-bottom:1px solid #20242c}
.lane .track{background:repeating-linear-gradient(90deg,transparent 0 calc(var(--pps) - 1px),rgba(255,255,255,.025) calc(var(--pps) - 1px) var(--pps))}
.clip{position:absolute;border-radius:5px;overflow:hidden;cursor:grab;display:flex;align-items:flex-end;touch-action:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.clip:active{cursor:grabbing}
.clip.v{background-color:var(--trk-video);background-repeat:no-repeat}
.clip.v.img{background-repeat:repeat-x;background-size:auto 100%}
.clip.t{background:var(--trk-text);align-items:center}
.clip.a{background-color:var(--trk-audio);background-repeat:no-repeat}
.clip .lbl{position:relative;z-index:1;margin:0 10px 4px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(0,0,0,.7);min-width:0;max-width:calc(100% - 20px);pointer-events:none}
.clip.t .lbl{margin-bottom:0}
.clip .bdg{position:absolute;top:4px;left:10px;display:flex;gap:4px;pointer-events:none;z-index:1}
.clip .bdg i{white-space:nowrap;font:700 9px/1 var(--f-ui);font-style:normal;background:rgba(0,0,0,.6);padding:3px 4px;border-radius:3px;letter-spacing:.03em}
.clip.v::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.55));pointer-events:none}
.clip.sel{box-shadow:inset 0 0 0 2px var(--cue);z-index:3}
.clip .h{position:absolute;top:0;bottom:0;width:10px;z-index:2;cursor:ew-resize;display:grid;place-items:center}
.clip .h::before{content:"";width:3px;height:40%;border-radius:2px;background:rgba(255,255,255,.7)}
.clip .h.l{left:0} .clip .h.r{right:0}
.clip.sel .h{background:var(--cue)} .clip.sel .h::before{background:var(--cue-ink)}
.clip.dragging{opacity:.85;z-index:9;box-shadow:0 8px 20px rgba(0,0,0,.5),inset 0 0 0 2px var(--cue)}
.trans{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:5px;transform:rotate(45deg);z-index:4;
  background:var(--raise2);border:1px solid #4a5263;display:grid;place-items:center}
.trans svg{transform:rotate(-45deg);width:12px;height:12px}
.trans.has{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.trans.sel{background:var(--cue);color:var(--cue-ink);border-color:var(--cue)}
.trans:hover{border-color:var(--cue)}
.insmark{position:absolute;top:4px;bottom:4px;width:3px;margin-left:-1px;background:var(--cue);border-radius:2px;z-index:8;pointer-events:none}
.empty{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:12px;white-space:nowrap;pointer-events:none}
#ph{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--cue);z-index:5;pointer-events:none}
#ph::before{content:"";position:absolute;top:0;left:-6px;width:14px;height:14px;background:var(--cue);clip-path:polygon(0 0,100% 0,100% 55%,50% 100%,0 55%)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,6,9,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:grid;gap:16px}
.modal h2{margin:0;font:800 20px/1.2 var(--f-brand);letter-spacing:-.01em}
.bar{height:8px;border-radius:99px;background:var(--raise2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cue);transition:width .2s linear}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#outVid{width:100%;max-height:44vh;background:#000;border-radius:6px}

.savest{font-size:11px;font-weight:700;color:var(--dim);white-space:nowrap}
.savest[data-s="Saving…"]{color:var(--muted)}
.savest[data-s="Not saved"],.savest[data-s="Not saving"]{color:#ff8a8d}
.modal.wide{width:min(760px,100%)}
.mhead{display:flex;align-items:center;gap:8px}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pcard{background:var(--raise);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid transparent;min-width:0}
.pcard.cur{border-color:rgba(242,193,78,.5)}
.pthumb{height:130px;background:#07080b;display:grid;place-items:center;position:relative;width:100%}
.pthumb span{height:100%;max-width:100%;background:#1d2129 center/cover no-repeat}
.pthumb em{position:absolute;left:8px;top:8px;font:700 9px/1 var(--f-ui);font-style:normal;letter-spacing:.06em;text-transform:uppercase;background:var(--cue);color:var(--cue-ink);padding:3px 5px;border-radius:3px}
.pmeta{padding:10px 10px 4px;display:grid;gap:2px;min-width:0}
.pmeta b{font:800 14px/1.25 var(--f-brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta span{font-size:11px;color:var(--muted)}
.pacts{display:flex;gap:4px;padding:6px 10px 10px;align-items:center}
.pacts .btn{height:30px;font-size:12px;flex:1;justify-content:center}
.pacts .ibtn.armed{color:#ff8a8d;background:rgba(229,72,77,.12);font-size:11px;font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:700;padding:9px 14px;border-radius:8px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.dropover{position:fixed;inset:0;z-index:40;background:rgba(242,193,78,.08);border:3px dashed var(--cue);display:grid;place-items:center;font:800 22px var(--f-brand);pointer-events:none}
#hold{position:fixed;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none;left:0;top:0}
#mbar{display:none}

@media (max-width:1100px){#app{grid-template-columns:236px minmax(0,1fr) 280px}}
@media (max-width:860px){
  :root{--headw:44px}
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:50px minmax(0,1fr) 210px calc(58px + env(safe-area-inset-bottom,0px));
    grid-template-areas:"top" "stage" "tl" "bar"}
  #projName,.hide-sm{display:none}
  .head span{display:none}
  .head{padding-inline:0;justify-content:center}
  .panel.sheet{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-height:64%;z-index:30;border:0;border-top:1px solid var(--line);
    border-radius:14px 14px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);transform:translateY(calc(100% + 80px));transition:transform .22s ease;visibility:hidden}
  .panel.sheet.open{transform:none;visibility:visible}
  .sheet-close{display:inline-flex}
  #mbar{grid-area:bar;display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom,0px)}
  #mbar button{flex:1;display:grid;justify-items:center;align-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
  #mbar button.on{color:var(--cue)}
  #mbar svg{width:20px;height:20px}
  .viewer{padding:10px}
  .transport{padding:6px 10px}
  .tside .pill{display:none}
  #zoom{width:80px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="topbar">
    <div class="brand"><i></i>Splice Studio</div>
    <button class="btn ghost" id="projBtn" title="Your saved projects"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span class="hide-sm">Projects</span></button>
    <input id="projName" aria-label="Project name" value="Weekend highlights">
    <span class="savest" id="saveSt" role="status">Saved</span>
    <div class="sp"></div>
    <button class="ibtn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ibtn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="btn primary" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>Export</button>
  </header>

  <aside class="panel sheet" id="left">
    <div class="tabs">
      <button class="tab on" data-ltab="media"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>Media</button>
      <button class="tab" data-ltab="text"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>Text</button>
      <button class="ibtn sheet-close" data-close aria-label="Close panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="pbody" id="leftBody"></div>
  </aside>

  <main id="stage">
    <div class="viewer" id="viewer"><canvas id="cv" width="720" height="1280"></canvas></div>
    <div class="transport">
      <div class="tside"><span class="tc" id="tc">00:00.00 <span>/ 00:00.00</span></span></div>
      <div class="tgroup">
        <button class="ibtn" id="toStart" aria-label="Go to start"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="m18 6-8 6 8 6z"/></svg></button>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FPS=30;
const ASPECTS={'9:16':[720,1280],'16:9':[1280,720],'1:1':[720,720],'4:5':[720,900]};
const ASPECT_NAMES={'9:16':'Reels · TikTok','16:9':'YouTube','1:1':'Square','4:5':'Feed post'};
const FILTERS=[
  {id:'none',name:'Original',css:''},
  {id:'vivid',name:'Vivid',css:'saturate(1.45) contrast(1.08)'},
  {id:'warm',name:'Golden',css:'sepia(.28) saturate(1.3) hue-rotate(-8deg) brightness(1.03)'},
  {id:'cool',name:'Coast',css:'saturate(1.1) hue-rotate(14deg) brightness(1.04) contrast(1.05)'},
  {id:'faded',name:'Faded',css:'contrast(.82) brightness(1.1) saturate(.7)'},
  {id:'mono',name:'Mono',css:'grayscale(1) contrast(1.1)'},
  {id:'noir',name:'Noir',css:'grayscale(1) contrast(1.55) brightness(.9)'},
  {id:'dream',name:'Dream',css:'saturate(1.25) brightness(1.08) contrast(.92) blur(.6px)'}
];
const TRANS=[{id:'none',name:'Cut'},{id:'fade',name:'Dissolve'},{id:'black',name:'Dip to black'},{id:'white',name:'Flash'},{id:'slide',name:'Slide'},{id:'wipe',name:'Wipe'},{id:'zoom',name:'Zoom through'},{id:'blur',name:'Blur'}];
const MOTIONS=[{id:'none',name:'Still'},{id:'zoomIn',name:'Push in'},{id:'zoomOut',name:'Pull out'},{id:'panL',name:'Pan left'},{id:'panR',name:'Pan right'}];
const FONTS=[
  {id:'anton',name:'Anton',fam:'"Anton", Impact, "Arial Narrow", sans-serif',w:400},
  {id:'bricolage',name:'Bricolage',fam:'"Bricolage Grotesque", "Arial Black", sans-serif',w:800},
  {id:'manrope',name:'Manrope',fam:'"Manrope", system-ui, sans-serif',w:800},
  {id:'serif',name:'Instrument',fam:'"Instrument Serif", Georgia, serif',w:400},
  {id:'caveat',name:'Caveat',fam:'"Caveat", "Comic Sans MS", cursive',w:700},
  {id:'mono',name:'Mono',fam:'"JetBrains Mono", ui-monospace, monospace',w:700}
];
const TSTYLES=[{id:'plain',name:'Plain'},{id:'shadow',name:'Shadow'},{id:'outline',name:'Outline'},{id:'box',name:'Label'}];
const ANIMS=[{id:'none',name:'None'},{id:'fade',name:'Fade'},{id:'pop',name:'Pop'},{id:'slide',name:'Rise'},{id:'type',name:'Typewriter'}];
const SWATCHES=['#ffffff','#111111','#f2c14e','#ff5d73','#4cc9f0','#7ee081','#c77dff','#ff8f3d'];
const canFilter=typeof CanvasRenderingContext2D!=='undefined' && 'filter' in CanvasRenderingContext2D.prototype;

const ICON={
  film:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>',
  text:'<svg viewBox="0 0 24 24"><path d="M5 6V4h14v2"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>',
  music:'<svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  trans:'<svg viewBox="0 0 24 24"><path d="M4 6l8 6-8 6zM20 6l-8 6 8 6z"/></svg>',
  split:'<svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h10M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  upload:'<svg viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 20h16"/></svg>',
  play:'<path d="M8 5v14l11-7z"/>', pause:'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>'
};

/* ---------------- state ---------------- */
const media={};           // id -> {id,name,kind,url,dur,w,h,img,thumb,strip,wave,sample}
let P={aspect:'9:16',bg:'#000000',clips:[],texts:[],audio:[]};
let T=0, playing=false, playT0=0, playW0=0, dirty=true, sel=null, pps=60, snap=true;
let exporting=null, textRects=[];
const cv=$('#cv'), ctx=cv.getContext('2d');
let W=cv.width, H=cv.height;

/* ---------------- audio graph ---------------- */
let actx=null, master=null, spk=null, recDest=null;
const els=new Map();
function ensureAudio(){
  if(actx){ if(actx.state==='suspended') actx.resume().catch(()=>{}); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{
    actx=new AC(); master=actx.createGain(); spk=actx.createGain();
    master.connect(spk); spk.connect(actx.destination);
    try{ recDest=actx.createMediaStreamDestination(); master.connect(recDest); }catch(e){ recDest=null; }
    els.forEach(connectEl);
  }catch(e){ actx=null; }
}
function connectEl(r){
  if(r.gain||!actx) return;
  try{ const s=actx.createMediaElementSource(r.el); const g=actx.createGain(); g.gain.value=0; s.connect(g); g.connect(master); r.gain=g; r.el.volume=1; }catch(e){}
}
function setGain(r,g){ g=Math.max(0,g); if(r.gain) r.gain.gain.value=g; else r.el.volume=clamp(g,0,1); }
function getEl(item){
  const m=media[item.mediaId]; if(!m||m.kind==='image') return null;
  let r=els.get(item.id);
  if(r && r.mediaId===item.mediaId) return r;
  const el=document.createElement(m.kind==='audio'?'audio':'video');
  el.preload='auto'; el.playsInline=true; el.setAttribute('playsinline',''); el.src=m.url;
  el.addEventListener('seeked',()=>{dirty=true}); el.addEventListener('loadeddata',()=>{dirty=true});
  $('#hold').appendChild(el);
  r={el,mediaId:item.mediaId,gain:null}; els.set(item.id,r); if(actx) connectEl(r); else el.volume=0;
  return r;
}
function pruneEls(){
  const live=new Set([...P.clips.map(c=>c.id),...P.audio.map(a=>a.id)]);
  els.forEach((r,id)=>{ if(!live.has(id)){ r.el.pause(); if(r.gain) try{r.gain.disconnect()}catch(e){} r.el.removeAttribute('src'); r.el.load(); r.el.remove(); els.delete(id);} });
}

/* ---------------- timing ---------------- */
function clipDur(c){ return Math.max(0.05,(c.out-c.in)/c.speed); }
function layout(){ let s=0; for(const c of P.clips){ c._s=s; c._d=clipDur(c); s+=c._d; } return s; }
function videoEnd(){ return layout(); }
function total(){
  let e=videoEnd();
  for(const t of P.texts) e=Math.max(e,t.start+t.dur);
  for(const a of P.audio) e=Math.max(e,a.start+(a.out-a.in));
  return Math.max(e,0.5);
}
function trDur(a,b){ return a.tr&&a.tr.type!=='none' ? Math.min(a.tr.dur, a._d*.9, b._d*.9) : 0; }
function visualAt(t){
  const cs=P.clips; if(!cs.length) return null; const ve=layout();
  let i=cs.findIndex(c=>t>=c._s && t<c._s+c._d);
  if(i<0){ if(t>=ve && t<ve+0.04) i=cs.length-1; else return null; }
  const c=cs[i];
  if(i>0){ const a=cs[i-1], d=trDur(a,c); if(d>0 && t<c._s+d/2) return {a, b:c, p:(t-(c._s-d/2))/d, type:a.tr.type}; }
  if(i<cs.length-1){ const b=cs[i+1], d=trDur(c,b); if(d>0 && t>=c._s+c._d-d/2) return {a:c, b, p:(t-(c._s+c._d-d/2))/d, type:c.tr.type}; }
  return {a:c};
}
const ease=p=>{p=clamp(p,0,1);return p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2};

function syncMedia(){
  const v=visualAt(T); const act=new Map();
  if(v){ if(v.b){ const e=ease(v.p); act.set(v.a.id,1-e); act.set(v.b.id,e); } else act.set(v.a.id,1); }
  for(const c of P.clips){
    const r=getEl(c); if(!r) continue; const el=r.el;
    const local=T-c._s, mix=act.get(c.id);
    const tgt=c.in+clamp(local,0,c._d-0.001)*c.speed;
    if(mix!==undefined){
      const run=playing && local>=0 && local<c._d;
      if(el.playbackRate!==c.speed) try{el.playbackRate=c.speed}catch(e){}
      setGain(r, run? c.volume*mix : 0);
      if(run){
        if(el.paused){ if(Math.abs(el.currentTime-tgt)>0.08) el.currentTime=tgt; el.play().catch(()=>{}); }
        else if(Math.abs(el.currentTime-tgt)>0.3) el.currentTime=tgt;
      } else { if(!el.paused) el.pause(); if(!el.seeking && Math.abs(el.currentTime-tgt)>0.02) el.currentTime=tgt; }
    } else {
      setGain(r,0); if(!el.paused) el.pause();
      const cue=local<0?c.in:tgt;
      if(!el.seeking && Math.abs(el.currentTime-cue)>0.05) el.currentTime=cue;
    }
  }
  for(const a of P.audio){
    const r=getEl(a); if(!r) continue; const el=r.el;
    const d=a.out-a.in, local=T-a.start, tgt=a.in+clamp(local,0,d);
    const inR=local>=0 && local<d;
    if(playing && inR){
      const g=a.volume*Math.min(1, a.fadeIn>0?local/a.fadeIn:1, a.fadeOut>0?(d-local)/a.fadeOut:1);
      setGain(r,g);
      if(el.paused){ if(Math.abs(el.currentTime-tgt)>0.08) el.currentTime=tgt; el.play().catch(()=>{}); }
      else if(Math.abs(el.currentTime-tgt)>0.3) el.currentTime=tgt;
    } else {
      setGain(r,0); if(!el.paused) el.pause();
      if(!el.seeking && Math.abs(el.currentTime-tgt)>0.05) el.currentTime=tgt;
    }
  }
}

/* ---------------- rendering ---------------- */
function filterStr(c){
  const f=(FILTERS.find(x=>x.id===c.filter)||FILTERS[0]).css; const a=c.adj||{};
  let s=f;
  if(a.b) s+=` brightness(${(1+a.b/100).toFixed(2)})`;
  if(a.c) s+=` contrast(${(1+a.c/100).toFixed(2)})`;
  if(a.s) s+=` saturate(${(1+a.s/100).toFixed(2)})`;
  return s.trim();
}
function drawClip(c,local,o={}){
  const m=media[c.mediaId]; if(!m) return;
  let src,sw,sh;
  if(m.kind==='image'){ src=m.img; sw=m.w; sh=m.h; }
  else { const r=getEl(c); if(!r||r.el.readyState<2) return; src=r.el; sw=src.videoWidth; sh=src.videoHeight; }
  if(!sw||!sh) return;
  const p=c._d? clamp(local,0,c._d)/c._d : 0;
  let k=1, px=0;
  switch(c.motion){ case 'zoomIn':k=1+.16*p;break; case 'zoomOut':k=1.16-.16*p;break; case 'panL':k=1.18;px=(p-.5);break; case 'panR':k=1.18;px=(.5-p);break; }
  const base=c.fit==='fit'? Math.min(W/sw,H/sh) : Math.max(W/sw,H/sh);
  const s=base*k*(o.scale||1), dw=sw*s, dh=sh*s;
  const x=(W-dw)/2 + px*Math.abs(dw-W)*.9 + (o.x||0), y=(H-dh)/2;
  ctx.save();
  if(o.clip){ ctx.beginPath(); ctx.rect(...o.clip); ctx.clip(); }
  ctx.globalAlpha=o.alpha==null?1:o.alpha;
  if(c.fit==='fit'){ ctx.fillStyle=P.bg; ctx.fillRect(o.x||0,0,W,H); }
  const f=(filterStr(c)+(o.filter||'')).trim();
  if(f && canFilter) ctx.filter=f;
  try{ ctx.drawImage(src,x,y,dw,dh); }catch(e){}
  ctx.restore();
}
function overlay(col,a){ ctx.save(); ctx.globalAlpha=clamp(a,0,1); ctx.fillStyle=col; ctx.fillRect(0,0,W,H); ctx.restore(); }
function drawTrans(v){
  const e=ease(v.p), la=T-v.a._s, lb=T-v.b._s, bs=W/720;
  switch(v.type){
    case 'fade': drawClip(v.a,la); drawClip(v.b,lb,{alpha:e}); break;
    case 'black': case 'white': { const col=v.type==='black'?'#000':'#fff';
      if(e<.5){ drawClip(v.a,la); overlay(col,e*2); } else { drawClip(v.b,lb); overlay(col,(1-e)*2); } break; }
    case 'slide': drawClip(v.a,la,{x:-e*W}); drawClip(v.b,lb,{x:(1-e)*W}); break;
    case 'wipe': drawClip(v.a,la); drawClip(v.b,lb,{clip:[0,0,e*W,H]});
      ctx.save(); ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillRect(e*W-2*bs,0,4*bs,H); ctx.restore(); break;
    case 'zoom': drawClip(v.b,lb,{scale:1.25-.25*e}); drawClip(v.a,la,{scale:1+e*.6,alpha:1-e}); break;
    case 'blur': drawClip(v.a,la,{filter:` blur(${(e*18*bs).toFixed(1)}px)`}); drawClip(v.b,lb,{alpha:e,filter:` blur(${((1-e)*18*bs).toFixed(1)}px)`}); break;
    default: drawClip(v.p<.5?v.a:v.b, v.p<.5?la:lb);
  }
}
function fontOf(tx,size){ const F=FONTS.find(f=>f.id===tx.font)||FONTS[0]; return `${tx.italic?'italic ':''}${F.w} ${size}px ${F.fam}`; }
function wrapLines(text,maxW){
  const out=[];
  for(const para of String(text).split('\n')){
    const words=para.split(' '); let line='';
    for(const w of words){ const tst=line?line+' '+w:w; if(line && ctx.measureText(tst).width>maxW){ out.push(line); line=w; } else line=tst; }
    out.push(line);
  }
  return out;
}
function rrect(x,y,w,h,r){ ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,w,h,r); else { ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); } }
function drawText(tx){
  const local=T-tx.start; if(local<0||local>tx.dur) return;
  const sc=Math.min(W,H)/720, size=tx.size*sc;
  ctx.save(); ctx.font=fontOf(tx,size);
  const lines=wrapLines(tx.text,W*.86), lh=size*1.12;
  const widths=lines.map(l=>ctx.measureText(l).width), mw=Math.max(1,...widths), bh=lines.length*lh;
  const pad=tx.style==='box'?size*.38:size*.12;
  const cx=tx.x*W, cy=tx.y*H;
  textRects.push({id:tx.id,x:cx-mw/2-pad,y:cy-bh/2-pad,w:mw+pad*2,h:bh+pad*2});
  const ai=Math.min(.5,tx.dur/3), ao=Math.min(.35,tx.dur/3);
  const pin=clamp(local/ai,0,1), pout=clamp((tx.dur-local)/ao,0,1);
  let alpha=1, s=1, dy=0, chars=Infinity;
  switch(tx.anim){
    case 'fade': alpha=Math.min(pin,pout); break;
    case 'pop': { const q=pin, c1=1.9, c3=c1+1; s=q>=1?1:.4+.6*(1+c3*Math.pow(q-1,3)+c1*Math.pow(q-1,2)); alpha=Math.min(1,pin*2.5)*pout; break; }
    case 'slide': dy=(1-(1-Math.pow(1-pin,3)))*size*.9; alpha=pin*pout; break;
    case 'type': { const n=tx.text.length; chars=Math.floor(n*clamp(local/Math.min(1.4,tx.dur*.5),0,1)); alpha=pout; break; }
  }
  if(alpha<=0.001){ ctx.restore(); return; }
  ctx.globalAlpha=alpha; ctx.translate(cx,cy+dy); ctx.scale(s,s);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(tx.style==='box'){ ctx.fillStyle=tx.bg; rrect(-mw/2-pad,-bh/2-pad*.55,mw+pad*2,bh+pad*1.1,size*.2); ctx.fill(); }
  let left=chars;
  lines.forEach((ln,i)=>{
    let str=ln; if(left!==Infinity){ str=ln.slice(0,Math.max(0,left)); left-=ln.length+1; }
    if(!str) return;
    const y=-bh/2+lh*(i+.5)+size*.04;
    if(tx.style==='outline'){ ctx.lineWidth=size*.16; ctx.strokeStyle=tx.bg; ctx.lineJoin='round'; ctx.strokeText(str,0,y); }
    if(tx.style==='shadow'){ ctx.shadowColor='rgba(0,0,0,.65)'; ctx.shadowBlur=size*.3; ctx.shadowOffsetY=size*.06; }
    ctx.fillStyle=tx.color; ctx.fillText(str,0,y);
  });
  ctx.restore();
}
function draw(){
  ctx.save(); ctx.fillStyle=P.bg; ctx.fillRect(0,0,W,H);
  const v=visualAt(T);
  if(v){ if(v.b) drawTrans(v); else drawClip(v.a,T-v.a._s); }
  textRects=[];

    const c=document.createElement('canvas'); c.width=n; c.height=h; const g=c.getContext('2d'); g.fillStyle='rgba(255,255,255,.55)';
    let peak=0.01; const pk=new Float32Array(n);
    for(let i=0;i<n;i++){ let mx=0; for(let j=i*per;j<(i+1)*per&&j<ch.length;j+=4){ const v=Math.abs(ch[j]); if(v>mx) mx=v; } pk[i]=mx; if(mx>peak) peak=mx; }

async function importFiles(files){

    if(!kind){ toast(`${f.name} isn't a video, audio or image file`); continue; }

    try{ await probe(m,f); }catch(e){ toast(`Couldn't open ${f.name}. Try MP4, MOV, WebM, MP3, WAV, JPG or PNG.`); URL.revokeObjectURL(m.url); continue; }
    m.blob=f; media[m.id]=m; added.push(addMedia(m,false)); await persistMedia(m);
  }
  if(added.length && dbOK && !askedPersist && navigator.storage && navigator.storage.persist){ askedPersist=true; navigator.storage.persist().catch(()=>{}); }

}

async function startExport(k,mime){

  setCanvasSize(w*k,h*k); T=0; syncMedia();

    <div class="stat">Recording<b id="exT">00:00.00 / ${fmtTC(total())}</b></div><p class="note">Sound is muted on your speakers while recording.</p>

  $('#exStop').onclick=()=>{ exporting.cancel=true; setPlaying(false); finishRecording(); };
  const t0=performance.now();
  while(performance.now()-t0<2500){ syncMedia(); const v=visualAt(0); const need=v?[v.a,v.b].filter(Boolean).map(getEl).filter(Boolean):[]; if(need.every(r=>r.el.readyState>=2&&!r.el.seeking)) break; await new Promise(r=>setTimeout(r,60)); }

async function saveBlob(blob,name){

function synthMusic(sec=12,sr=22050){
  const n=sec*sr, d=new Float32Array(n);
  const chords=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]];
  const TAU=Math.PI*2;
  for(let i=0;i<n;i++){
    const t=i/sr, ci=Math.floor(t/3)%4, ch=chords[ci], lt=t%3;
    const env=Math.min(1,lt/.4)*Math.min(1,(3-lt)/.5);
    let pad=0; for(const f of ch) pad+=Math.sin(TAU*f*t)+.25*Math.sin(TAU*f*2*t);
    const k=Math.floor(t/.25), note=ch[k%3]*2*(k%8>=4?1.5:1), l2=t%.25;
    const pl=Math.sin(TAU*note*t)*Math.exp(-l2*10);
    const bass=Math.sin(TAU*ch[0]/2*t)*Math.exp(-(t%.5)*3);
    const kick=(t%.5)<.12?Math.sin(TAU*(55+140*Math.exp(-(t%.5)*40))*(t%.5))*Math.exp(-(t%.5)*25):0;
    d[i]=clamp(pad*env*.05+pl*.13+bass*.16+kick*.35,-1,1)*.85;
  }
  const buf=new ArrayBuffer(44+n*2), v=new DataView(buf); const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++) v.setInt16(44+i*2,d[i]*32767,true);
  return buf;
}

/* ---------------- saved projects (IndexedDB, on this device) ---------------- */
const DB={db:null,
  open(){ return new Promise((res,rej)=>{ if(!window.indexedDB) return rej(new Error('no idb'));
    const r=indexedDB.open('splice-studio',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('projects',{keyPath:'id'}); d.createObjectStore('media',{keyPath:'id'}); };
    r.onsuccess=()=>{ this.db=r.result; res(this.db); }; r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked')); }); },
  tx(st,mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(st,mode), q=fn(t.objectStore(st)); let out;
    if(q) q.onsuccess=()=>{ out=q.result; }; t.oncomplete=()=>res(out); t.onerror=t.onabort=()=>rej(t.error); }); },
  get(st,id){ return this.tx(st,'readonly',s=>s.get(id)); },
  put(st,v){ return this.tx(st,'readwrite',s=>s.put(v)); },
  del(st,id){ return this.tx(st,'readwrite',s=>s.delete(id)); },
  all(st){ return this.tx(st,'readonly',s=>s.getAll()); }
};

async function openProject(id){

async function deleteProject(id){
  const recs=await DB.all('projects'); const rec=recs.find(r=>r.id===id); if(!rec) return;
  const inUse=new Set(); recs.forEach(r=>{ if(r.id!==id) (r.mediaIds||[]).forEach(m=>inUse.add(m)); });
  for(const mid of rec.mediaIds||[]) if(!inUse.has(mid)) await DB.del('media',mid).catch(()=>{});
  await DB.del('projects',id);
  if(id===curId){
    curId=null; const rest=recs.filter(r=>r.id!==id).sort((a,b)=>b.updated-a.updated);
    if(rest.length) await openProject(rest[0].id); else { await newProject(); return; }

}
